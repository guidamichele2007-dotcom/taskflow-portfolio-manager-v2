/* ===== js/ai.js ===== */
/* ============================================================
   ai.js — Intelligenza artificiale dei bot.
   Macchina a stati (obiettivo → ingaggio → ritirata) con
   pathfinding A*, kiting, raccolta oggetti e uso di
   super/gadget contestuale. Difficoltà scalabile.
   ============================================================ */
'use strict';

class BotBrain {
  constructor(brawler, difficulty) {
    this.b = brawler;
    this.diff = difficulty || 0.6;      // 0..1: precisione e reattività
    this.path = null;
    this.pathIdx = 0;
    this.repathT = 0;
    this.target = null;                 // nemico corrente
    this.thinkT = Util.rand(0, 0.3);    // decisioni sfalsate tra i bot
    this.strafeDir = Math.random() < 0.5 ? 1 : -1;
    this.strafeT = 0;
    this.goal = null;                   // {x, y, kind}
  }

  update(game, dt) {
    const b = this.b;
    if (!b.alive) return;

    this.thinkT -= dt;
    if (this.thinkT <= 0) {
      this.thinkT = 0.25 + (1 - this.diff) * 0.3;
      this.think(game);
    }
    this.moveAlongPath(game, dt);
    this.combat(game, dt);
  }

  /* ---------- Decisioni ad alto livello ---------- */
  think(game) {
    const b = this.b;

    /* 1. Trova il nemico visibile più vicino */
    this.target = null;
    let bd = 1e9;
    for (const e of game.brawlers) {
      if (e.team === b.team || !e.alive) continue;
      if (!e.visibleTo(game, b)) continue;
      const d = Util.dist(b.x, b.y, e.x, e.y);
      if (d < bd) { bd = d; this.target = e; }
    }

    /* 2. Scegli la destinazione in base a salute/obiettivo */
    const lowHp = b.hp < b.effMaxHp() * 0.3;
    let goal = null;

    if (lowHp && this.target) {
      /* Ritirata: allontanati dal nemico */
      const a = Util.angTo(this.target.x, this.target.y, b.x, b.y);
      goal = { x: b.x + Math.cos(a) * 180, y: b.y + Math.sin(a) * 180, kind: 'flee' };
    } else {
      /* Obiettivo di modalità (gemme, palla, zona, cassaforte...) */
      goal = game.mode.botGoal(game, b) || null;
      /* Raccogli pickup vicini */
      let bestPick = null, bpd = 240;
      for (const p of game.pickups) {
        const d = Util.dist(b.x, b.y, p.x, p.y);
        if (d < bpd) { bpd = d; bestPick = p; }
      }
      if (bestPick && (!goal || goal.prio !== 2)) goal = { x: bestPick.x, y: bestPick.y, kind: 'pickup' };
      /* Nessun obiettivo: insegui il bersaglio o vaga */
      if (!goal && this.target) goal = { x: this.target.x, y: this.target.y, kind: 'hunt' };
      if (!goal) goal = { x: game.map.center.x + Util.rand(-100, 100), y: game.map.center.y + Util.rand(-100, 100), kind: 'wander' };
    }
    this.goal = goal;

    /* 3. Ricalcola il percorso se serve */
    this.repathT -= this.thinkT;
    const needRepath = !this.path || this.pathIdx >= this.path.length || this.repathT <= 0;
    if (needRepath && goal) {
      this.path = game.map.findPath(b.x, b.y, goal.x, goal.y);
      this.pathIdx = 0;
      this.repathT = 1.2;
    }
  }

  /* ---------- Movimento lungo il percorso + strafe in combattimento ---------- */
  moveAlongPath(game, dt) {
    const b = this.b;
    b.moveX = 0; b.moveY = 0;

    /* In combattimento ravvicinato: kiting laterale per schivare */
    const a = b.def.attack;
    if (this.target && this.goal && this.goal.kind !== 'flee') {
      const d = Util.dist(b.x, b.y, this.target.x, this.target.y);
      const ideal = a.type === 'melee' ? a.range * 0.7 : a.range * 0.72;
      if (d < a.range * 1.05) {
        this.strafeT -= dt;
        if (this.strafeT <= 0) { this.strafeT = Util.rand(0.5, 1.4); this.strafeDir *= -1; }
        const toT = Util.angTo(b.x, b.y, this.target.x, this.target.y);
        /* Mantieni la distanza ideale + movimento laterale */
        const radial = d > ideal + 20 ? 1 : d < ideal - 20 ? -1 : 0;
        const strafe = this.strafeDir;
        b.moveX = Math.cos(toT) * radial + Math.cos(toT + Math.PI / 2) * strafe;
        b.moveY = Math.sin(toT) * radial + Math.sin(toT + Math.PI / 2) * strafe;
        return;
      }
    }

    /* Segui i waypoint del percorso A* */
    if (this.path && this.pathIdx < this.path.length) {
      const wp = this.path[this.pathIdx];
      const d = Util.dist(b.x, b.y, wp.x, wp.y);
      if (d < TILE * 0.6) { this.pathIdx++; return; }
      b.moveX = (wp.x - b.x) / d;
      b.moveY = (wp.y - b.y) / d;
    } else if (this.goal) {
      const d = Util.dist(b.x, b.y, this.goal.x, this.goal.y);
      if (d > 20) {
        b.moveX = (this.goal.x - b.x) / d;
        b.moveY = (this.goal.y - b.y) / d;
      }
    }
  }

  /* ---------- Combattimento: attacco, super, gadget ---------- */
  combat(game, dt) {
    const b = this.b;
    const t = this.target;
    if (!t) return;
    const a = b.def.attack;
    const d = Util.dist(b.x, b.y, t.x, t.y);
    if (d > a.range * 1.05) return;

    /* Serve linea di vista (tranne i lanciatori) */
    if (a.type !== 'lob' && !game.map.lineOfSight(b.x, b.y, t.x, t.y)) return;

    /* Predizione di tiro: mira dove sarà il bersaglio */
    const flight = d / (a.speed || 400);
    const lead = this.diff * 0.85;
    const px = t.x + (t.moveX || 0) * t.speed() * flight * lead;
    const py = t.y + (t.moveY || 0) * t.speed() * flight * lead;
    let ang = Util.angTo(b.x, b.y, px, py);
    /* Errore di mira in base alla difficoltà */
    ang += Util.rand(-1, 1) * (1 - this.diff) * 0.25;
    b.facing = ang;

    /* Attacca (i bot tengono 1 colpo di riserva a bassa difficoltà) */
    if (b.canAttack() && Math.random() < this.diff * 0.9 + 0.1) {
      b.attack(game, ang);
    }

    /* Super: usala se il bersaglio è a portata e la super è carica */
    if (b.canSuper() && d < (b.def.super.range || 200) && Math.random() < 0.35) {
      b.useSuper(game, ang);
    }

    /* Hypercharge: appena pronta in combattimento */
    if (b.canHyper() && Math.random() < 0.3) b.useHyper(game);

    /* Gadget difensivi quando la vita scende */
    if (b.canGadget()) {
      const g = b.def.gadget.type;
      const low = b.hp < b.effMaxHp() * 0.4;
      if ((g === 'selfheal' || g === 'shield' || g === 'stealth' || g === 'fortify') && low && Math.random() < 0.5) b.useGadget(game);
      else if ((g === 'dash' || g === 'nova' || g === 'overcharge') && d < 120 && Math.random() < 0.25) b.useGadget(game);
      else if ((g === 'mine' || g === 'trap' || g === 'icewall') && Math.random() < 0.08) b.useGadget(game);
    }

    /* Emote occasionale dopo un'uccisione (personalità!) */
    if (Math.random() < dt * 0.02) b.showEmote(Util.choice(b.def.emotes));
  }
}

/* ===== js/modes.js ===== */
/* ============================================================
   modes.js — Logica delle modalità di gioco.
   Ogni modalità implementa un'interfaccia comune:
     setup(game)                — crea brawler e oggetti
     update(game, dt)           — regole per frame
     onDeath(game, b, killer)   — gestione eliminazioni
     botGoal(game, bot)         — obiettivo per l'IA
     drawWorld(ctx, game)       — oggetti di modalità
     hudText(game)              — testo punteggio in alto
     checkEnd(game)             — condizione di fine partita
   ============================================================ */
'use strict';

/* Definizione della cassaforte (Rapina) come entità statica */
function makeSafeDef() {
  return {
    id: 'safe', name: 'CASSAFORTE', cls: 'Statico', color: '#8892a8', dark: '#3a4152',
    hp: 26000, speed: 0, desc: '',
    attack: { name: '-', type: 'single', count: 1, damage: 0, range: 0, speed: 1, radius: 1, reload: 99, ammo: 0 },
    super: { name: '-', type: 'none', charge: 1e9 },
    gadget: { name: '-', type: 'none', uses: 0 },
    hyper: { name: '-', type: 'none', dur: 0, charge: 99 },
    emotes: [], skins: [{ id: 'def', name: '-', color: '#8892a8' }]
  };
}

/* ---------- Classe base con comportamenti comuni ---------- */
class BaseMode {
  constructor(game) {
    this.game = game;
    this.timeLeft = 120;        // limite standard 2 minuti
    this.respawnTime = 3;       // 0 = niente respawn
    this.over = null;           // risultato finale
  }

  /* Crea il giocatore + bot per una 3v3 standard */
  setup3v3(game) {
    game.playerTeam = 0;
    const used = new Set([Save.state.selectedBrawler]);
    const pick = () => {
      const free = BRAWLERS.filter(b => !used.has(b.id));
      const d = Util.choice(free.length ? free : BRAWLERS);
      used.add(d.id);
      return d.id;
    };
    game.addPlayer(0);
    game.addBot(0, pick()); game.addBot(0, pick());
    game.addBot(1, pick()); game.addBot(1, pick()); game.addBot(1, pick());
    /* Posiziona sulle piazzole di spawn */
    for (const team of [0, 1]) {
      const spots = game.map.spawns[team];
      let i = 0;
      for (const b of game.brawlers) {
        if (b.team !== team) continue;
        const s = spots[i % spots.length] || game.map.center;
        b.x = s.x; b.y = s.y;
        b.homeX = s.x; b.homeY = s.y;
        i++;
      }
    }
  }

  /* Respawn automatico alla base */
  handleRespawns(game, dt) {
    if (!this.respawnTime) return;
    for (const b of game.brawlers) {
      if (b.alive || b.staticEntity || b.respawnT > 0) continue;
      b.respawn(game, b.homeX, b.homeY);
    }
  }

  onDeath(game, b, killer) {
    if (this.respawnTime) b.respawnT = this.respawnTime;
  }

  botGoal() { return null; }
  drawWorld() {}
  hudText() { return ''; }
  update(game, dt) {
    this.timeLeft -= dt;
    this.handleRespawns(game, dt);
  }

  /* Vittoria a tempo scaduto in base a un punteggio [team0, team1] */
  timeoutResult(score0, score1) {
    if (score0 > score1) return { win: true };
    if (score1 > score0) return { win: false };
    return { win: false, draw: true };
  }
}

/* ============================ GEM GRAB ============================ */
class GemGrabMode extends BaseMode {
  constructor(game) {
    super(game);
    this.spawnT = 2;
    this.countdown = -1;        // conto alla rovescia di vittoria
    this.countTeam = -1;
    this.timeLeft = 150;
  }
  setup(game) { this.setup3v3(game); }

  teamGems(game, team) {
    let g = 0;
    for (const b of game.brawlers) if (b.team === team && b.alive) g += b.gems;
    return g;
  }

  update(game, dt) {
    super.update(game, dt);
    /* Il pozzo genera una gemma ogni 4 secondi (max 12 sul campo) */
    this.spawnT -= dt;
    const onField = game.pickups.filter(p => p.type === 'gem').length;
    if (this.spawnT <= 0 && onField < 12) {
      this.spawnT = 4;
      game.spawnPickup(game.map.center.x + Util.rand(-14, 14), game.map.center.y + Util.rand(-14, 14), 'gem');
      game.particles.burst(game.map.center.x, game.map.center.y, 6, { color: '#b78aff', maxSpeed: 70, life: 0.5, glow: true });
    }
    /* Conto alla rovescia quando una squadra ha 10+ gemme */
    const g0 = this.teamGems(game, 0), g1 = this.teamGems(game, 1);
    const leader = g0 >= 10 ? 0 : g1 >= 10 ? 1 : -1;
    if (leader >= 0) {
      if (this.countTeam !== leader) { this.countTeam = leader; this.countdown = 15; }
      this.countdown -= dt;
      if (this.countdown <= 0) this.over = { win: leader === 0 };
    } else {
      this.countTeam = -1; this.countdown = -1;
    }
    if (this.timeLeft <= 0) this.over = this.timeoutResult(g0, g1);
  }

  onDeath(game, b, killer) {
    super.onDeath(game, b, killer);
    /* Le gemme si spargono a terra */
    for (let i = 0; i < b.gems; i++) {
      const a = Util.rand(0, TAU);
      game.spawnPickup(b.x + Math.cos(a) * Util.rand(10, 40), b.y + Math.sin(a) * Util.rand(10, 40), 'gem');
    }
    b.gems = 0;
  }

  botGoal(game, bot) {
    /* I portatori carichi si ritirano, gli altri contestano il centro */
    if (bot.gems >= 4) return { x: bot.homeX, y: bot.homeY, kind: 'retreat', prio: 2 };
    return { x: game.map.center.x, y: game.map.center.y, kind: 'objective', prio: 1 };
  }

  drawWorld(ctx, game) {
    /* Pozzo delle gemme */
    const c = game.map.center;
    ctx.fillStyle = '#3a2a5a';
    ctx.beginPath(); ctx.arc(c.x, c.y, 20, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#b78aff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(c.x, c.y, 20 + Math.sin(game.time * 3) * 2, 0, TAU); ctx.stroke();
  }

  hudText(game) {
    const g0 = this.teamGems(game, 0), g1 = this.teamGems(game, 1);
    let s = `💎 ${g0}  —  ${g1} 💎`;
    if (this.countdown > 0) s += `   ⏳ ${Math.ceil(this.countdown)}`;
    return s;
  }
  checkEnd() { return this.over; }
}

/* ============================ SHOWDOWN ============================ */
class ShowdownMode extends BaseMode {
  constructor(game, duo) {
    super(game);
    this.duo = duo;
    this.respawnTime = 0;
    this.timeLeft = 150;
    this.gasR = 0;              // raggio del gas (dal bordo verso il centro)
    this.gasT = 12;             // il gas inizia dopo 12s
    this.rankOut = 0;           // quanti eliminati finora
  }

  setup(game) {
    const spots = Util.shuffle(game.map.spawns.ffa.slice());
    if (this.duo) {
      /* 5 squadre da 2: il giocatore è nel team 0 col suo compagno */
      game.playerTeam = 0;
      this.respawnTime = 5;   // in duo si rientra se il compagno è vivo
      game.addPlayer(0);
      game.addBot(0);
      for (let t = 1; t < 5; t++) { game.addBot(t); game.addBot(t); }
      let i = 0;
      for (const b of game.brawlers) {
        const s = spots[Math.floor(i / 2) % spots.length];
        b.x = s.x + (i % 2) * 30; b.y = s.y;
        b.homeX = b.x; b.homeY = b.y;
        i++;
      }
      this.teamsTotal = 5;
    } else {
      game.playerTeam = 0;
      game.addPlayer(0);
      for (let t = 1; t < 10; t++) game.addBot(t);
      let i = 0;
      for (const b of game.brawlers) {
        const s = spots[i % spots.length];
        b.x = s.x; b.y = s.y; b.homeX = s.x; b.homeY = s.y;
        i++;
      }
      this.teamsTotal = 10;
    }
  }

  aliveTeams(game) {
    const t = new Set();
    for (const b of game.brawlers) if (b.alive || b.respawnT > 0) t.add(b.team);
    return t;
  }

  update(game, dt) {
    this.timeLeft -= dt;
    /* Respawn duo: solo se il compagno è ancora vivo */
    if (this.duo) {
      for (const b of game.brawlers) {
        if (b.alive || b.respawnT > 0) continue;
        const mate = game.brawlers.find(o => o.team === b.team && o !== b && o.alive);
        if (mate) b.respawn(game, mate.x + 20, mate.y);
      }
    }
    /* Avanzamento del gas velenoso */
    this.gasT -= dt;
    if (this.gasT <= 0) this.gasR = Math.min(game.map.pixelW * 0.42, this.gasR + dt * 9);
    /* Danno da gas */
    const m = game.map;
    for (const b of game.brawlers) {
      if (!b.alive) continue;
      const inGas = b.x < this.gasR || b.y < this.gasR || b.x > m.pixelW - this.gasR || b.y > m.pixelH - this.gasR;
      if (inGas) {
        b.takeDamage(game, 700 * dt, null, true);
        if (Math.random() < dt * 4) game.particles.sparkle(b.x, b.y, '#8cff3a');
      }
    }
  }

  onDeath(game, b, killer) {
    /* Rilascia i power cube */
    for (let i = 0; i < Math.max(1, b.cubes); i++) {
      const a = Util.rand(0, TAU);
      game.spawnPickup(b.x + Math.cos(a) * Util.rand(8, 30), b.y + Math.sin(a) * Util.rand(8, 30), 'cube');
    }
    b.cubes = 0;
    if (this.duo) {
      const mate = game.brawlers.find(o => o.team === b.team && o !== b && o.alive);
      if (mate) b.respawnT = this.respawnTime;
    }
  }

  botGoal(game, bot) {
    /* Fuggi dal gas prima di tutto */
    const m = game.map, margin = this.gasR + TILE * 2;
    if (bot.x < margin || bot.y < margin || bot.x > m.pixelW - margin || bot.y > m.pixelH - margin) {
      return { x: m.pixelW / 2, y: m.pixelH / 2, kind: 'flee-gas', prio: 2 };
    }
    /* Rompi le casse dei power cube */
    let best = null, bd = 400;
    for (const c of m.cubes) {
      const d = Util.dist(bot.x, bot.y, (c.tx + 0.5) * TILE, (c.ty + 0.5) * TILE);
      if (d < bd) { bd = d; best = c; }
    }
    if (best) return { x: (best.tx + 0.5) * TILE, y: (best.ty + 0.5) * TILE, kind: 'cube', prio: 1 };
    return null;
  }

  drawWorld(ctx, game) {
    /* Gas velenoso ai bordi */
    if (this.gasR > 2) {
      const m = game.map, r = this.gasR;
      ctx.fillStyle = 'rgba(120,220,60,.3)';
      ctx.fillRect(0, 0, m.pixelW, r);
      ctx.fillRect(0, m.pixelH - r, m.pixelW, r);
      ctx.fillRect(0, r, r, m.pixelH - r * 2);
      ctx.fillRect(m.pixelW - r, r, r, m.pixelH - r * 2);
      ctx.strokeStyle = 'rgba(140,255,58,.8)'; ctx.lineWidth = 2;
      ctx.strokeRect(r, r, m.pixelW - r * 2, m.pixelH - r * 2);
    }
  }

  hudText(game) {
    const alive = this.aliveTeams(game).size;
    return this.duo ? `👥 Squadre rimaste: ${alive}` : `💀 Rimasti: ${alive}`;
  }

  checkEnd(game) {
    const alive = this.aliveTeams(game);
    const playerIn = alive.has(game.playerTeam);
    if (!playerIn) {
      /* Il giocatore è eliminato: piazzamento = squadre rimaste + 1 */
      return { win: alive.size <= 1, rank: alive.size + 1 };
    }
    if (alive.size <= 1) return { win: true, rank: 1 };
    if (this.timeLeft <= 0) return { win: false, rank: alive.size, draw: true };
    return null;
  }
}

/* ============================ BRAWL BALL ============================ */
class BrawlBallMode extends BaseMode {
  constructor(game) {
    super(game);
    this.score = [0, 0];
    this.timeLeft = 150;
    this.ball = { x: 0, y: 0, vx: 0, vy: 0, carrier: null };
    this.resetT = 0;
    this.goalW = TILE * 4;
  }

  setup(game) {
    this.setup3v3(game);
    this.ball.x = game.map.center.x;
    this.ball.y = game.map.center.y;
  }

  /* Rettangoli delle porte: team 0 difende in alto, team 1 in basso */
  goalRect(game, team) {
    const m = game.map;
    const gx = m.pixelW / 2 - this.goalW / 2;
    return team === 0 ? { x: gx, y: 0, w: this.goalW, h: TILE }
                      : { x: gx, y: m.pixelH - TILE, w: this.goalW, h: TILE };
  }

  update(game, dt) {
    super.update(game, dt);
    const ball = this.ball;

    if (this.resetT > 0) { this.resetT -= dt; return; }

    if (ball.carrier && !ball.carrier.alive) ball.carrier = null;
    if (ball.carrier) {
      /* La palla segue il portatore */
      ball.x = ball.carrier.x + Math.cos(ball.carrier.facing) * 20;
      ball.y = ball.carrier.y + Math.sin(ball.carrier.facing) * 20;
    } else {
      /* Fisica della palla: attrito e rimbalzo sui muri */
      ball.x += ball.vx * dt; ball.y += ball.vy * dt;
      const f = Math.pow(0.4, dt);
      ball.vx *= f; ball.vy *= f;
      if (game.map.circleHits(ball.x, ball.y, 9)) {
        ball.x -= ball.vx * dt * 2; ball.y -= ball.vy * dt * 2;
        if (game.map.circleHits(ball.x + ball.vx * dt, ball.y, 9)) ball.vx *= -0.7;
        if (game.map.circleHits(ball.x, ball.y + ball.vy * dt, 9)) ball.vy *= -0.7;
      }
      ball.x = Util.clamp(ball.x, 10, game.map.pixelW - 10);
      ball.y = Util.clamp(ball.y, 10, game.map.pixelH - 10);
      /* Raccolta */
      for (const b of game.brawlers) {
        if (!b.alive || b.stunT > 0) continue;
        if (Util.dist(b.x, b.y, ball.x, ball.y) < b.radius + 12) {
          ball.carrier = b; b.hasBall = true;
          AudioSys.sfx('kick');
          break;
        }
      }
    }

    /* Gol! */
    for (const team of [0, 1]) {
      const g = this.goalRect(game, team);
      if (ball.x > g.x && ball.x < g.x + g.w && ball.y > g.y && ball.y < g.y + g.h) {
        const scorer = 1 - team;          // chi segna nella porta di "team"
        this.score[scorer]++;
        AudioSys.sfx('goal');
        game.shake(8);
        game.particles.explosion(ball.x, ball.y, 60, '#ffe14d');
        game.announce(scorer === game.playerTeam ? 'GOL! ⚽' : 'Gol subito...');
        if (this.score[scorer] >= 2) this.over = { win: scorer === 0 };
        this.resetPositions(game);
        return;
      }
    }
    if (this.timeLeft <= 0) this.over = this.timeoutResult(this.score[0], this.score[1]);
  }

  resetPositions(game) {
    this.ball.carrier = null;
    this.ball.vx = this.ball.vy = 0;
    this.ball.x = game.map.center.x;
    this.ball.y = game.map.center.y;
    this.resetT = 1.5;
    for (const b of game.brawlers) {
      b.hasBall = false;
      if (b.alive) { b.x = b.homeX; b.y = b.homeY; b.hp = b.effMaxHp(); }
    }
  }

  /* Chiamato dal gioco quando il portatore preme attacco: calcio! */
  kickBall(game, kicker, ang) {
    if (this.ball.carrier !== kicker) return false;
    this.ball.carrier = null;
    kicker.hasBall = false;
    this.ball.vx = Math.cos(ang) * 520;
    this.ball.vy = Math.sin(ang) * 520;
    AudioSys.sfx('kick');
    game.particles.muzzle(this.ball.x, this.ball.y, ang, '#ffffff');
    return true;
  }

  onDeath(game, b, killer) {
    super.onDeath(game, b, killer);
    if (this.ball.carrier === b) { this.ball.carrier = null; b.hasBall = false; }
  }

  botGoal(game, bot) {
    const enemyGoal = this.goalRect(game, 1 - bot.team);
    if (this.ball.carrier === bot) {
      /* Porta la palla in porta; calcia se vicino */
      const gx = enemyGoal.x + enemyGoal.w / 2, gy = enemyGoal.y + enemyGoal.h / 2;
      if (Util.dist(bot.x, bot.y, gx, gy) < 200 && game.map.lineOfSight(bot.x, bot.y, gx, gy)) {
        this.kickBall(game, bot, Util.angTo(bot.x, bot.y, gx, gy));
      }
      return { x: gx, y: gy, kind: 'score', prio: 2 };
    }
    if (!this.ball.carrier) return { x: this.ball.x, y: this.ball.y, kind: 'ball', prio: 2 };
    if (this.ball.carrier.team !== bot.team) return { x: this.ball.carrier.x, y: this.ball.carrier.y, kind: 'chase', prio: 1 };
    /* Compagno con la palla: accompagna l'azione */
    const g2 = this.goalRect(game, 1 - bot.team);
    return { x: g2.x + g2.w / 2 + Util.rand(-80, 80), y: g2.y + (bot.team === 0 ? -60 : 60) * -1, kind: 'support', prio: 0 };
  }

  drawWorld(ctx, game) {
    /* Porte */
    for (const team of [0, 1]) {
      const g = this.goalRect(game, team);
      ctx.fillStyle = team === 0 ? 'rgba(38,217,255,.35)' : 'rgba(255,74,94,.35)';
      ctx.fillRect(g.x, g.y, g.w, g.h);
      ctx.strokeStyle = team === 0 ? '#26d9ff' : '#ff4a5e';
      ctx.lineWidth = 3;
      ctx.strokeRect(g.x, g.y, g.w, g.h);
    }
    /* Palla */
    if (!this.ball.carrier && this.resetT <= 0) {
      ctx.font = '22px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('⚽', this.ball.x, this.ball.y + 8);
    }
  }

  hudText() { return `⚽ ${this.score[0]}  —  ${this.score[1]}`; }
  checkEnd() { return this.over; }
}

/* ============================ RAPINA (HEIST) ============================ */
class HeistMode extends BaseMode {
  constructor(game) { super(game); this.timeLeft = 120; }

  setup(game) {
    this.setup3v3(game);
    /* Casseforti davanti agli spawn */
    this.safes = [];
    for (const team of [0, 1]) {
      const s = new Brawler('safe', 1, team, 'CASSAFORTE', true);
      s.staticEntity = true;
      s.radius = 22;
      const spot = game.map.spawns[team][1] || game.map.spawns[team][0];
      s.x = spot.x; s.y = spot.y + (team === 0 ? 60 : -60);
      s.homeX = s.x; s.homeY = s.y;
      game.brawlers.push(s);
      this.safes.push(s);
    }
  }

  update(game, dt) {
    super.update(game, dt);
    const hp0 = this.safes[0].hp, hp1 = this.safes[1].hp;
    if (this.timeLeft <= 0) this.over = this.timeoutResult(hp0, hp1);
  }

  onDeath(game, b, killer) {
    if (b.staticEntity) {
      this.over = { win: b.team === 1 };   // cassaforte rossa distrutta = vittoria blu
      game.shake(14);
      game.particles.explosion(b.x, b.y, 90, '#ffcf5e');
      return;
    }
    super.onDeath(game, b, killer);
  }

  botGoal(game, bot) {
    const enemySafe = this.safes[1 - bot.team];
    const mySafe = this.safes[bot.team];
    /* Metà squadra difende se la propria cassaforte è sotto attacco */
    if (mySafe.hp < mySafe.maxHp * 0.7 && (bot.id % 2 === 0)) {
      return { x: mySafe.x, y: mySafe.y - 40, kind: 'defend', prio: 1 };
    }
    return { x: enemySafe.x, y: enemySafe.y + (bot.team === 0 ? -50 : 50), kind: 'attack', prio: 1 };
  }

  drawWorld(ctx, game) {
    for (const s of this.safes) {
      if (!s.alive) continue;
      ctx.font = '30px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('💰', s.x, s.y + 10);
    }
  }

  hudText() {
    const p = (s) => Math.max(0, Math.round(s.hp / s.maxHp * 100)) + '%';
    return `💰 ${p(this.safes[0])}  —  ${p(this.safes[1])} 💰`;
  }
  checkEnd() { return this.over; }
}

/* ============================ KNOCKOUT ============================ */
class KnockoutMode extends BaseMode {
  constructor(game) {
    super(game);
    this.respawnTime = 0;
    this.rounds = [0, 0];
    this.roundTime = 60;
    this.betweenT = 0;
  }
  setup(game) { this.setup3v3(game); }

  update(game, dt) {
    if (this.betweenT > 0) {
      this.betweenT -= dt;
      if (this.betweenT <= 0) this.resetRound(game);
      return;
    }
    this.roundTime -= dt;
    const alive0 = game.brawlers.filter(b => b.team === 0 && b.alive).length;
    const alive1 = game.brawlers.filter(b => b.team === 1 && b.alive).length;
    let roundWinner = -1;
    if (alive0 === 0) roundWinner = 1;
    else if (alive1 === 0) roundWinner = 0;
    else if (this.roundTime <= 0) roundWinner = alive0 >= alive1 ? 0 : 1;
    if (roundWinner >= 0) {
      this.rounds[roundWinner]++;
      game.announce(roundWinner === game.playerTeam ? 'Round vinto! 🥊' : 'Round perso...');
      if (this.rounds[roundWinner] >= 2) this.over = { win: roundWinner === 0 };
      else this.betweenT = 2.5;
    }
  }

  resetRound(game) {
    this.roundTime = 60;
    for (const b of game.brawlers) {
      b.respawn(game, b.homeX, b.homeY);
      b.superCharge = 0.4;   // piccolo aiuto tra i round
      b.gadgetUses = Math.max(1, b.gadgetUses);
    }
  }

  botGoal(game, bot) {
    return { x: game.map.center.x + Util.rand(-90, 90), y: game.map.center.y + Util.rand(-60, 60), kind: 'objective', prio: 0 };
  }

  hudText() { return `🥊 ${this.rounds[0]}  —  ${this.rounds[1]}   ⏱ ${Math.max(0, Math.ceil(this.roundTime))}`; }
  checkEnd() { return this.over; }
}

/* ============================ ZONA CALDA ============================ */
class HotZoneMode extends BaseMode {
  constructor(game) {
    super(game);
    this.progress = [0, 0];
    this.need = 30;          // secondi di controllo per vincere
    this.timeLeft = 150;
    this.zoneR = 100;
  }
  setup(game) { this.setup3v3(game); }

  update(game, dt) {
    super.update(game, dt);
    const c = this.game.map.center;
    let in0 = 0, in1 = 0;
    for (const b of this.game.brawlers) {
      if (!b.alive) continue;
      if (Util.dist(b.x, b.y, c.x, c.y) < this.zoneR) {
        if (b.team === 0) in0++; else in1++;
      }
    }
    if (in0 > 0 && in1 === 0) this.progress[0] += dt;
    if (in1 > 0 && in0 === 0) this.progress[1] += dt;
    if (this.progress[0] >= this.need) this.over = { win: true };
    else if (this.progress[1] >= this.need) this.over = { win: false };
    else if (this.timeLeft <= 0) this.over = this.timeoutResult(this.progress[0], this.progress[1]);
  }

  botGoal(game, bot) {
    const c = game.map.center;
    return { x: c.x + Util.rand(-this.zoneR, this.zoneR) * 0.6, y: c.y + Util.rand(-this.zoneR, this.zoneR) * 0.6, kind: 'objective', prio: 1 };
  }

  drawWorld(ctx, game) {
    const c = game.map.center;
    const pulse = Math.sin(game.time * 3) * 4;
    ctx.fillStyle = 'rgba(255,110,60,.18)';
    ctx.beginPath(); ctx.arc(c.x, c.y, this.zoneR, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#ff6e3c'; ctx.lineWidth = 3;
    ctx.setLineDash([12, 8]);
    ctx.beginPath(); ctx.arc(c.x, c.y, this.zoneR + pulse, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
  }

  hudText() {
    const p = (v) => Math.min(100, Math.round(v / this.need * 100)) + '%';
    return `🔥 ${p(this.progress[0])}  —  ${p(this.progress[1])}`;
  }
  checkEnd() { return this.over; }
}

/* ============================ TAGLIA (BOUNTY) ============================ */
class BountyMode extends BaseMode {
  constructor(game) {
    super(game);
    this.stars = [0, 0];
    this.timeLeft = 120;
  }
  setup(game) {
    this.setup3v3(game);
    for (const b of game.brawlers) b.stars = 2;
  }

  update(game, dt) {
    super.update(game, dt);
    if (this.timeLeft <= 0) this.over = this.timeoutResult(this.stars[0], this.stars[1]);
  }

  onDeath(game, b, killer) {
    super.onDeath(game, b, killer);
    if (killer && killer.team !== b.team && !killer.staticEntity) {
      this.stars[killer.team] += b.stars;
      game.particles.text(b.x, b.y - 40, `+${b.stars} ⭐`, '#ffe14d', 16);
      killer.stars = Math.min(7, killer.stars + 1);
      b.stars = 2;
    }
  }

  botGoal(game, bot) {
    /* Gioca prudente: resta a metà campo */
    const c = game.map.center;
    const side = bot.team === 0 ? -1 : 1;
    return { x: c.x + Util.rand(-120, 120), y: c.y + side * Util.rand(30, 130), kind: 'objective', prio: 0 };
  }

  hudText() { return `⭐ ${this.stars[0]}  —  ${this.stars[1]}`; }
  checkEnd() { return this.over; }
}

/* ============================ BOSS FIGHT ============================ */
class BossFightMode extends BaseMode {
  constructor(game) {
    super(game);
    this.respawnTime = 6;
    this.timeLeft = 180;
    this.lives = 6;           // respawn di squadra limitati
  }

  setup(game) {
    game.playerTeam = 0;
    game.addPlayer(0);
    game.addBot(0); game.addBot(0);
    /* Il boss */
    const boss = new Brawler('boss', 1, 1, 'MEGA-TRON', true);
    boss.radius = 30;
    boss.brain = new BotBrain(boss, 0.75);
    boss.x = game.map.center.x; boss.y = game.map.center.y;
    boss.homeX = boss.x; boss.homeY = boss.y;
    game.brawlers.push(boss);
    this.boss = boss;
    /* Posiziona la squadra */
    const spots = game.map.spawns[0].length ? game.map.spawns[0] : game.map.spawns.ffa;
    let i = 0;
    for (const b of game.brawlers) {
      if (b.team !== 0) continue;
      const s = spots[i % spots.length];
      b.x = s.x; b.y = s.y; b.homeX = s.x; b.homeY = s.y;
      i++;
    }
  }

  update(game, dt) {
    this.timeLeft -= dt;
    /* Il boss usa la super quando circondato */
    if (this.boss.alive && this.boss.superCharge >= 1) this.boss.useSuper(game, this.boss.facing);
    /* Il boss si infuria sotto il 50% */
    if (this.boss.alive && this.boss.hp < this.boss.maxHp * 0.5 && !this.enraged) {
      this.enraged = true;
      this.boss.hasteT = 999; this.boss.hasteAmt = 0.35;
      game.announce('Il boss è FURIOSO! 😡');
    }
    /* Respawn con vite di squadra */
    for (const b of game.brawlers) {
      if (b.team !== 0 || b.alive || b.respawnT > 0) continue;
      if (this.lives > 0) { this.lives--; b.respawnT = this.respawnTime; }
    }
    if (this.timeLeft <= 0) this.over = { win: false };
  }

  onDeath(game, b, killer) {
    if (b === this.boss) { this.over = { win: true }; return; }
  }

  botGoal(game, bot) {
    if (bot.team === 0) return { x: this.boss.x + Util.rand(-100, 100), y: this.boss.y + Util.rand(-100, 100), kind: 'boss', prio: 1 };
    return null;
  }

  hudText() {
    const pct = Math.max(0, Math.round(this.boss.hp / this.boss.maxHp * 100));
    return `🤖 Boss: ${pct}%   ❤️ Vite: ${this.lives}`;
  }
  checkEnd() { return this.over; }
}

/* ---------- Factory ---------- */
function createMode(id, game) {
  switch (id) {
    case 'gemgrab':   return new GemGrabMode(game);
    case 'showdown':  return new ShowdownMode(game, false);
    case 'duo':       return new ShowdownMode(game, true);
    case 'brawlball': return new BrawlBallMode(game);
    case 'heist':     return new HeistMode(game);
    case 'knockout':  return new KnockoutMode(game);
    case 'hotzone':   return new HotZoneMode(game);
    case 'bounty':    return new BountyMode(game);
    case 'bossfight': return new BossFightMode(game);
    default:          return new GemGrabMode(game);
  }
}

/* Registra le definizioni dinamiche (boss, cassaforte) */
BRAWLER_BY_ID['boss'] = makeBossDef();
BRAWLER_BY_ID['safe'] = makeSafeDef();

/* ===== js/hud.js ===== */
/* ============================================================
   hud.js — HUD di battaglia e input touch.
   Joystick dinamico (lato sinistro), pulsanti attacco / super /
   gadget / hypercharge / emote (lato destro) con mira manuale
   trascinando o mira automatica con un tocco.
   Fallback tastiera+mouse per desktop: WASD, click, E, Q, H.
   ============================================================ */
'use strict';

class HUD {
  constructor(canvas) {
    this.canvas = canvas;
    this.reset();

    /* Layout ricalcolato a ogni resize */
    this.buttons = {};
    this.relayout(canvas.clientWidth, canvas.clientHeight);

    /* Tocco / mouse unificati via Pointer Events */
    canvas.addEventListener('pointerdown', (e) => this.onDown(e));
    canvas.addEventListener('pointermove', (e) => this.onMove(e));
    canvas.addEventListener('pointerup', (e) => this.onUp(e));
    canvas.addEventListener('pointercancel', (e) => this.onUp(e));

    /* Tastiera (desktop) */
    this.keys = {};
    window.addEventListener('keydown', (e) => {
      this.keys[e.key.toLowerCase()] = true;
      if (!window.game || !window.game.active) return;
      if (e.key.toLowerCase() === 'e') window.game.playerSuper(null);
      if (e.key.toLowerCase() === 'q') window.game.playerGadget();
      if (e.key.toLowerCase() === 'h') window.game.playerHyper();
      if (e.key.toLowerCase() === 't') window.game.playerEmote();
    });
    window.addEventListener('keyup', (e) => { this.keys[e.key.toLowerCase()] = false; });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  reset() {
    this.move = { x: 0, y: 0 };
    this.joy = null;            // {id, baseX, baseY, x, y}
    this.aim = null;            // {id, type, startX, startY, ang, dist, dragged}
    this.pressed = {};          // pulsanti premuti (feedback visivo)
  }

  relayout(w, h) {
    const s = Math.min(w, h) / 420;   // scala UI in base allo schermo
    const m = 18 * s;
    this.scale = s;
    this.buttons = {
      attack: { x: w - 78 * s, y: h - 84 * s, r: 52 * s },
      super:  { x: w - 172 * s, y: h - 62 * s, r: 38 * s },
      gadget: { x: w - 60 * s, y: h - 178 * s, r: 27 * s },
      hyper:  { x: w - 148 * s, y: h - 152 * s, r: 27 * s },
      emote:  { x: w - 34 * s, y: h * 0.42, r: 20 * s },
      quit:   { x: 30 * s, y: 30 * s, r: 20 * s }
    };
    this.w = w; this.h = h;
  }

  pos(e) {
    const r = this.canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  hitButton(p) {
    for (const name in this.buttons) {
      const b = this.buttons[name];
      if (Util.dist(p.x, p.y, b.x, b.y) < b.r + 8) return name;
    }
    return null;
  }

  /* ---------- Gestione tocchi ---------- */
  onDown(e) {
    const g = window.game;
    if (!g || !g.active) return;
    e.preventDefault();
    const p = this.pos(e);
    const btn = this.hitButton(p);

    if (btn === 'attack' || btn === 'super') {
      /* Inizio mira: tap = auto, drag = manuale */
      if (btn === 'super' && !g.player.canSuper()) { AudioSys.sfx('ui'); return; }
      this.aim = { id: e.pointerId, type: btn, startX: p.x, startY: p.y, ang: 0, dist: 0, dragged: false };
      this.pressed[btn] = true;
      return;
    }
    if (btn === 'gadget') { g.playerGadget(); this.flash('gadget'); return; }
    if (btn === 'hyper') { g.playerHyper(); this.flash('hyper'); return; }
    if (btn === 'emote') { g.playerEmote(); this.flash('emote'); return; }
    if (btn === 'quit') { g.requestQuit(); return; }

    /* Joystick dinamico: qualsiasi tocco sulla metà sinistra */
    if (p.x < this.w * 0.5 && !this.joy) {
      this.joy = { id: e.pointerId, baseX: p.x, baseY: p.y, x: p.x, y: p.y };
    }
  }

  onMove(e) {
    const p = this.pos(e);
    if (this.joy && e.pointerId === this.joy.id) {
      this.joy.x = p.x; this.joy.y = p.y;
      const dx = p.x - this.joy.baseX, dy = p.y - this.joy.baseY;
      const d = Math.hypot(dx, dy);
      const max = 52 * this.scale;
      /* La base segue il dito se trascinato oltre il raggio (joystick "flottante") */
      if (d > max) {
        this.joy.baseX = p.x - dx / d * max;
        this.joy.baseY = p.y - dy / d * max;
      }
      const dead = 8 * this.scale;
      this.move = d > dead ? { x: dx / Math.max(d, 1), y: dy / Math.max(d, 1) } : { x: 0, y: 0 };
    }
    if (this.aim && e.pointerId === this.aim.id) {
      const dx = p.x - this.aim.startX, dy = p.y - this.aim.startY;
      const d = Math.hypot(dx, dy);
      if (d > 24 * this.scale) this.aim.dragged = true;
      if (this.aim.dragged) {
        this.aim.ang = Math.atan2(dy, dx);
        this.aim.dist = d;
      }
    }
  }

  onUp(e) {
    const g = window.game;
    if (this.joy && e.pointerId === this.joy.id) {
      this.joy = null;
      this.move = { x: 0, y: 0 };
    }
    if (this.aim && e.pointerId === this.aim.id) {
      const a = this.aim;
      this.aim = null;
      this.pressed[a.type] = false;
      if (g && g.active) {
        const ang = a.dragged ? a.ang : null;   // null = mira automatica
        if (a.type === 'attack') g.playerAttack(ang);
        else g.playerSuper(ang);
      }
    }
  }

  flash(name) {
    this.pressed[name] = true;
    setTimeout(() => this.pressed[name] = false, 130);
  }

  /* Input tastiera → movimento (desktop) */
  keyboardMove() {
    let x = 0, y = 0;
    if (this.keys['w'] || this.keys['arrowup']) y -= 1;
    if (this.keys['s'] || this.keys['arrowdown']) y += 1;
    if (this.keys['a'] || this.keys['arrowleft']) x -= 1;
    if (this.keys['d'] || this.keys['arrowright']) x += 1;
    return { x, y };
  }

  /* ---------- Disegno HUD (coordinate schermo) ---------- */
  draw(ctx, game) {
    const s = this.scale;
    const p = game.player;

    /* --- Joystick --- */
    if (this.joy) {
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(this.joy.baseX, this.joy.baseY, 52 * s, 0, TAU); ctx.fill();
      ctx.globalAlpha = 0.7;
      const dx = this.joy.x - this.joy.baseX, dy = this.joy.y - this.joy.baseY;
      const d = Math.min(Math.hypot(dx, dy), 52 * s);
      const a = Math.atan2(dy, dx);
      ctx.beginPath();
      ctx.arc(this.joy.baseX + Math.cos(a) * d, this.joy.baseY + Math.sin(a) * d, 26 * s, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    /* --- Pulsante attacco --- */
    const atk = this.buttons.attack;
    this.drawButton(ctx, atk, this.pressed.attack ? '#ff6a6a' : '#e04a4a', '#7a1f1f');
    /* Tacche munizioni dentro il pulsante */
    const maxA = p.maxAmmo;
    for (let i = 0; i < maxA; i++) {
      const aa = -Math.PI / 2 + (i - (maxA - 1) / 2) * 0.55;
      const full = p.ammo >= i + 1;
      const part = !full && p.ammo > i ? p.ammo - i : 0;
      ctx.strokeStyle = full ? '#ffe14d' : part > 0 ? `rgba(255,225,77,${0.25 + part * 0.5})` : 'rgba(255,255,255,.25)';
      ctx.lineWidth = 7 * s;
      ctx.beginPath();
      ctx.arc(atk.x, atk.y, atk.r - 8 * s, aa - 0.22, aa + 0.22);
      ctx.stroke();
    }
    ctx.fillStyle = '#fff';
    ctx.font = `${26 * s}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('⚔️', atk.x, atk.y + 4 * s);

    /* --- Pulsante super --- */
    const sup = this.buttons.super;
    const ready = p.canSuper();
    this.drawButton(ctx, sup, ready ? '#ffe14d' : '#3a4160', '#8a6a00');
    /* Anello di carica */
    ctx.strokeStyle = ready ? '#fff' : '#ffe14d';
    ctx.lineWidth = 5 * s;
    ctx.beginPath();
    ctx.arc(sup.x, sup.y, sup.r - 4 * s, -Math.PI / 2, -Math.PI / 2 + TAU * Util.clamp(p.superCharge, 0, 1));
    ctx.stroke();
    if (ready) {
      ctx.globalAlpha = 0.4 + 0.3 * Math.sin(game.time * 6);
      ctx.fillStyle = '#ffe14d';
      ctx.beginPath(); ctx.arc(sup.x, sup.y, sup.r + 6 * s, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = ready ? '#5a3800' : '#8892c9';
    ctx.font = `bold ${22 * s}px sans-serif`;
    ctx.fillText('★', sup.x, sup.y + 2 * s);

    /* --- Gadget --- */
    const gad = this.buttons.gadget;
    const canG = p.canGadget();
    this.drawButton(ctx, gad, canG ? '#4ae06e' : '#3a4160', '#1d7a36');
    ctx.font = `${18 * s}px sans-serif`;
    ctx.fillStyle = '#fff';
    ctx.fillText('🔧', gad.x, gad.y);
    ctx.font = `bold ${11 * s}px sans-serif`;
    ctx.fillText(String(p.gadgetUses), gad.x + gad.r * 0.7, gad.y - gad.r * 0.7);

    /* --- Hypercharge --- */
    const hyp = this.buttons.hyper;
    const canH = p.canHyper();
    const hypOn = p.hyperT > 0;
    this.drawButton(ctx, hyp, hypOn ? `hsl(${(game.time * 300) % 360},90%,55%)` : canH ? '#ff42f5' : '#3a4160', '#7a1f78');
    ctx.strokeStyle = '#ff8af5';
    ctx.lineWidth = 4 * s;
    ctx.beginPath();
    ctx.arc(hyp.x, hyp.y, hyp.r - 3 * s, -Math.PI / 2, -Math.PI / 2 + TAU * Util.clamp(p.hyperCharge, 0, 1));
    ctx.stroke();
    ctx.font = `${16 * s}px sans-serif`;
    ctx.fillStyle = '#fff';
    ctx.fillText('⚡', hyp.x, hyp.y);

    /* --- Emote e uscita --- */
    this.drawButton(ctx, this.buttons.emote, 'rgba(30,38,90,.8)', '#131b52');
    ctx.font = `${16 * s}px sans-serif`;
    ctx.fillText('💬', this.buttons.emote.x, this.buttons.emote.y);
    this.drawButton(ctx, this.buttons.quit, 'rgba(30,38,90,.8)', '#131b52');
    ctx.fillStyle = '#ff6a6a';
    ctx.font = `bold ${18 * s}px sans-serif`;
    ctx.fillText('✕', this.buttons.quit.x, this.buttons.quit.y);

    /* --- Barra superiore: punteggio modalità + timer --- */
    const hudTxt = game.mode.hudText(game);
    if (hudTxt) {
      ctx.font = `bold ${17 * s}px 'Trebuchet MS', sans-serif`;
      const tw = ctx.measureText(hudTxt).width + 30 * s;
      ctx.fillStyle = 'rgba(10,14,40,.75)';
      this.roundRect(ctx, this.w / 2 - tw / 2, 10 * s, tw, 30 * s, 15 * s);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillText(hudTxt, this.w / 2, 25 * s);
    }
    if (game.mode.timeLeft !== undefined && game.mode.timeLeft < 9000) {
      const t = Math.max(0, Math.ceil(game.mode.timeLeft));
      ctx.font = `bold ${14 * s}px sans-serif`;
      ctx.fillStyle = t <= 10 ? '#ff6a6a' : '#c8d0ff';
      ctx.fillText(`⏱ ${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`, this.w / 2, 52 * s);
    }

    /* --- Vita del giocatore in basso a sinistra --- */
    if (p.alive) {
      const bw = 130 * s, bh = 14 * s, bx = 16 * s, by = this.h - 28 * s;
      ctx.fillStyle = 'rgba(0,0,0,.5)';
      this.roundRect(ctx, bx - 2, by - 2, bw + 4, bh + 4, 7 * s); ctx.fill();
      const frac = p.hp / p.effMaxHp();
      ctx.fillStyle = frac > 0.5 ? '#4ae06e' : frac > 0.25 ? '#ffe14d' : '#ff4a5e';
      this.roundRect(ctx, bx, by, bw * frac, bh, 6 * s); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${11 * s}px sans-serif`;
      ctx.fillText(`${Math.ceil(p.hp)} / ${p.effMaxHp()}`, bx + bw / 2, by + bh / 2 + 1);
    } else if (p.respawnT > 0) {
      ctx.fillStyle = 'rgba(0,0,0,.55)';
      ctx.fillRect(0, 0, this.w, this.h);
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${30 * s}px sans-serif`;
      ctx.fillText(`Rientri tra ${Math.ceil(p.respawnT)}...`, this.w / 2, this.h / 2);
    }

    /* --- FPS (opzionale nelle impostazioni) --- */
    if (Save.state.settings.showFps) {
      ctx.font = `${11 * s}px monospace`;
      ctx.fillStyle = '#8cff3a';
      ctx.textAlign = 'left';
      ctx.fillText(`${game.fps | 0} FPS`, 8, this.h - 60 * s);
      ctx.textAlign = 'center';
    }
    ctx.textBaseline = 'alphabetic';
  }

  drawButton(ctx, b, fill, shadow) {
    ctx.fillStyle = shadow;
    ctx.beginPath(); ctx.arc(b.x, b.y + 3, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = fill;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.35)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r - 2, 0, TAU); ctx.stroke();
  }

  roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
}

/* ===== js/game.js ===== */
/* ============================================================
   game.js — Orchestratore della partita.
   Gestisce entità, proiettili, zone ad area, raccoglibili,
   camera con shake, danni, mira automatica e rendering.
   ============================================================ */
'use strict';

class Game {
  constructor(modeId, canvas, hud) {
    this.modeId = modeId;
    this.canvas = canvas;
    this.hud = hud;
    this.map = new GameMap(modeId);
    this.particles = new ParticleSystem();
    this.brawlers = [];
    this.projectiles = [];
    this.projPool = new Pool(() => new Projectile());
    this.zones = [];
    this.pickups = [];
    this.playerTeam = 0;
    this.player = null;
    this.time = 0;
    this.fps = 60;
    this.countdown = 3.2;       // 3..2..1..GO
    this.lastCount = 4;
    this.active = false;        // input abilitato dopo il countdown
    this.finished = false;
    this.endTimer = 0;
    this.endResult = null;
    this.shakeAmt = 0;
    this.announceText = '';
    this.announceT = 0;
    this.cam = { x: 0, y: 0, zoom: 1 };

    this.mode = createMode(modeId, this);
    this.mode.setup(this);
    hud.reset();
    /* Inquadra subito il giocatore (senza lerp dal bordo) */
    this.updateCamera(0);
    this.cam.x = this.camTargetX;
    this.cam.y = this.camTargetY;
    AudioSys.music('battle');
  }

  /* ---------- Creazione entità ---------- */
  addPlayer(team) {
    const id = Save.state.selectedBrawler;
    const bs = Save.brawlerState(id);
    const def = BRAWLER_BY_ID[id];
    const skin = def.skins.find(s => s.id === bs.skin) || def.skins[0];
    const b = new Brawler(id, bs.level, team, Save.state.name, false, skin.color);
    this.player = b;
    this.brawlers.push(b);
    return b;
  }

  addBot(team, defId) {
    const pool = BRAWLERS.filter(d => d.id !== 'boss');
    const def = defId ? BRAWLER_BY_ID[defId] : Util.choice(pool);
    const level = Math.max(1, Save.brawlerState(Save.state.selectedBrawler).level + Util.irand(-1, 1));
    /* Nomi bot senza duplicati nella stessa partita */
    if (!this.namePool || !this.namePool.length) this.namePool = Util.shuffle(BOT_NAMES.slice());
    const b = new Brawler(def.id, level, team, this.namePool.pop(), true);
    /* Difficoltà scala con i trofei del giocatore */
    const diff = Util.clamp(0.45 + Save.totalTrophies() / 4000, 0.45, 0.9);
    b.brain = new BotBrain(b, diff + Util.rand(-0.1, 0.1));
    this.brawlers.push(b);
    return b;
  }

  spawnPickup(x, y, type) { this.pickups.push(new Pickup(x, y, type)); }

  /* ---------- Input del giocatore ---------- */
  playerAttack(ang) {
    const p = this.player;
    if (!p.alive) return;
    if (ang === null) ang = this.autoAimAngle(p);
    if (ang === null) ang = p.facing;
    p.attack(this, ang);
  }

  playerSuper(ang) {
    const p = this.player;
    if (!p.alive || !p.canSuper()) return;
    if (ang === null) ang = this.autoAimAngle(p, this.player.def.super.range || 250) ?? p.facing;
    p.useSuper(this, ang);
  }

  playerGadget() { if (this.player.alive) this.player.useGadget(this); }
  playerHyper() { if (this.player.alive) this.player.useHyper(this); }
  playerEmote() {
    const e = this.player.def.emotes;
    this.player.showEmote(Util.choice(e));
  }

  /* Mira automatica: nemico visibile più vicino a portata */
  autoAimAngle(b, rangeOverride) {
    const a = b.def.attack;
    const range = (rangeOverride || a.range) * 1.18;
    let best = null, bd = range;
    for (const e of this.brawlers) {
      if (e.team === b.team || !e.alive) continue;
      if (!e.visibleTo(this, b)) continue;
      const d = Util.dist(b.x, b.y, e.x, e.y);
      if (d > bd) continue;
      /* I lanciatori non hanno bisogno di linea di vista */
      if (a.type !== 'lob' && !this.map.lineOfSight(b.x, b.y, e.x, e.y)) continue;
      bd = d; best = e;
    }
    if (!best) return null;
    /* Predizione del movimento del bersaglio */
    const flight = bd / (a.speed || 400);
    const px = best.x + (best.moveX || 0) * best.speed() * flight * 0.7;
    const py = best.y + (best.moveY || 0) * best.speed() * flight * 0.7;
    return Util.angTo(b.x, b.y, px, py);
  }

  requestQuit() {
    /* Abbandono: conta come sconfitta */
    this.finish({ win: false, quit: true });
  }

  announce(text) { this.announceText = text; this.announceT = 2.2; }
  shake(amt) { this.shakeAmt = Math.max(this.shakeAmt, amt); }

  /* ---------- Proiettili ---------- */
  spawnProjectile(owner, ang, opts) {
    const pr = this.projPool.get();
    pr.init(owner, ang, opts);
    this.projectiles.push(pr);
  }

  updateProjectiles(dt) {
    for (let i = this.projectiles.length - 1; i >= 0; i--) {
      const pr = this.projectiles[i];
      let dead = false;

      /* Boomerang: fase di ritorno verso il proprietario */
      if (pr.boomerang && pr.returning) {
        const o = pr.owner;
        pr.ang = Util.angTo(pr.x, pr.y, o.x, o.y);
        if (Util.dist(pr.x, pr.y, o.x, o.y) < 20 || !o.alive) dead = true;
      }
      const step = pr.speed * dt;
      pr.x += Math.cos(pr.ang) * step;
      pr.y += Math.sin(pr.ang) * step;
      pr.traveled += step;

      /* Scia luminosa */
      if (pr.trail && Math.random() < 0.6) {
        this.particles.emit(pr.x, pr.y, { life: 0.25, size: 4, color: pr.color, glow: true });
      }

      /* Fine gittata */
      if (!dead && pr.traveled >= pr.range) {
        if (pr.lob || pr.aoe) { this.explodeAt(pr); dead = true; }
        else if (pr.boomerang && !pr.returning) { pr.returning = true; pr.hitSet.clear(); }
        else dead = true;
      }

      /* Collisione con i muri (i lob volano sopra) */
      if (!dead && !pr.pierceWalls) {
        const t = this.map.tileAtWorld(pr.x, pr.y);
        if (this.map.blocksProjectile(t)) {
          this.map.damageWall((pr.x / TILE) | 0, (pr.y / TILE) | 0, pr.damage, this);
          this.particles.hit(pr.x, pr.y, pr.color);
          if (pr.aoe) this.explodeAt(pr);
          dead = true;
        }
      }
      /* Fuori mappa */
      if (!dead && (pr.x < 0 || pr.y < 0 || pr.x > this.map.pixelW || pr.y > this.map.pixelH)) dead = true;

      /* Collisione con i brawler */
      if (!dead && !pr.lob) {
        for (const e of this.brawlers) {
          if (!e.alive || e === pr.owner || pr.hitSet.has(e.id)) continue;
          if (Util.dist2(pr.x, pr.y, e.x, e.y) > (pr.radius + e.radius) ** 2) continue;

          if (e.team === pr.team) {
            /* Dardo curativo sugli alleati */
            if (pr.healAlly) {
              pr.hitSet.add(e.id);
              e.heal(this, pr.damage * pr.healAlly);
              dead = true;
              break;
            }
            continue;
          }
          pr.hitSet.add(e.id);
          /* Danno con bonus distanza (cecchini) */
          let dmg = pr.damage;
          if (pr.farBonus) dmg *= 1 + (pr.farBonus - 1) * Util.clamp(pr.traveled / pr.range, 0, 1);
          this.dealDamage(pr.owner, e, dmg);
          if (pr.slow) e.slowT = Math.max(e.slowT, pr.slow);
          if (pr.burn) { e.burnT = 2.5; e.burnDps = pr.burn / 2.5; e.burnFrom = pr.owner; }

          /* Fulmine a catena */
          if (pr.chain > 0) {
            let next = null, nd = 130;
            for (const o of this.brawlers) {
              if (o.team === pr.team || !o.alive || pr.hitSet.has(o.id)) continue;
              const d = Util.dist(e.x, e.y, o.x, o.y);
              if (d < nd) { nd = d; next = o; }
            }
            if (next) {
              const cp = this.projPool.get();
              cp.init(pr.owner, Util.angTo(e.x, e.y, next.x, next.y), {
                damage: pr.damage * 0.8, range: 150, speed: pr.speed, radius: pr.radius,
                chain: pr.chain - 1, color: pr.color
              });
              cp.x = e.x; cp.y = e.y;
              cp.hitSet = new Set(pr.hitSet);
              this.projectiles.push(cp);
              this.particles.emit(e.x, e.y, { life: 0.2, size: 10, color: pr.color, shape: 'ring' });
            }
          }
          if (pr.aoe) { this.explodeAt(pr); dead = true; break; }
          if (!pr.pierceUnits && !pr.boomerang) { dead = true; break; }
        }
      }

      if (dead) {
        this.projPool.release(pr);
        this.projectiles[i] = this.projectiles[this.projectiles.length - 1];
        this.projectiles.pop();
      }
    }
  }

  /* Esplosione ad area di un proiettile */
  explodeAt(pr) {
    this.particles.explosion(pr.x, pr.y, pr.aoe || 30, pr.color);
    AudioSys.sfx('explode');
    if (pr.isSuper) this.map.destroyArea(pr.x, pr.y, (pr.aoe || 30) * 0.8, this);
    this.shake(pr.isSuper ? 5 : 2);
    for (const e of this.brawlers) {
      if (e.team === pr.team || !e.alive) continue;
      const d = Util.dist(pr.x, pr.y, e.x, e.y);
      if (d < (pr.aoe || 30) + e.radius) {
        this.dealDamage(pr.owner, e, pr.damage);
        if (pr.slow) e.slowT = Math.max(e.slowT, pr.slow);
        if (pr.burn) { e.burnT = 2.5; e.burnDps = pr.burn / 2.5; e.burnFrom = pr.owner; }
      }
    }
  }

  dealDamage(attacker, victim, dmg) {
    victim.takeDamage(this, dmg, attacker);
  }

  /* ---------- Zone ad area (super, gadget, scie) ---------- */
  updateZones(dt) {
    for (let i = this.zones.length - 1; i >= 0; i--) {
      const z = this.zones[i];
      z.dur -= dt;
      if (z.dur <= 0) { this.zones.splice(i, 1); continue; }
      if (z.follow) { z.x = z.follow.x; z.y = z.follow.y; if (!z.follow.alive) { this.zones.splice(i, 1); continue; } }
      z.tick = (z.tick || 0) - dt;

      switch (z.type) {
        case 'heal':
          for (const b of this.brawlers) {
            if (b.team !== z.team || !b.alive || b.staticEntity) continue;
            if (Util.dist(b.x, b.y, z.x, z.y) < z.radius + b.radius) {
              b.hp = Math.min(b.effMaxHp(), b.hp + z.heal * dt);
              if (z.shield) { b.shieldT = Math.max(b.shieldT, 0.6); b.shieldPct = Math.max(b.shieldPct, 0.25); }
              if (Math.random() < dt * 3) this.particles.healFx(b.x, b.y);
            }
          }
          break;
        case 'totem':
          for (const b of this.brawlers) {
            if (!b.alive || b.staticEntity) continue;
            const inside = Util.dist(b.x, b.y, z.x, z.y) < z.radius + b.radius;
            if (!inside) continue;
            if (b.team === z.team) {
              b.hp = Math.min(b.effMaxHp(), b.hp + z.heal * dt);
              b.hasteT = Math.max(b.hasteT, 0.3); b.hasteAmt = Math.max(b.hasteAmt, 0.15);
            } else if (z.dmgEnemies) {
              b.takeDamage(this, z.dmgEnemies * dt, z.owner, true);
            }
          }
          break;
        case 'frost':
          for (const b of this.brawlers) {
            if (b.team === z.team || !b.alive) continue;
            if (Util.dist(b.x, b.y, z.x, z.y) < z.radius + b.radius) {
              b.slowT = Math.max(b.slowT, 0.4);
              b.takeDamage(this, z.dmg * dt / 2, z.owner, true);
              if (z.root && !z.rooted) { z.rooted = new Set(); }
              if (z.root && !z.rooted.has(b.id)) { z.rooted.add(b.id); b.rootT = 1.5; this.particles.text(b.x, b.y - 28, '🧊', '#fff', 16); }
            }
          }
          break;
        case 'storm':
          if (z.tick <= 0) {
            z.tick = 0.7;
            let best = null, bd = z.radius;
            for (const b of this.brawlers) {
              if (b.team === z.team || !b.alive) continue;
              const d = Util.dist(b.x, b.y, z.x, z.y);
              if (d < bd) { bd = d; best = b; }
            }
            if (best) {
              this.dealDamage(z.owner, best, z.dmg);
              this.particles.burst(best.x, best.y, 8, { color: '#f5e642', maxSpeed: 120, life: 0.3, glow: true });
              AudioSys.sfx('hit');
            }
          }
          break;
        case 'fire':
          for (const b of this.brawlers) {
            if (!b.alive) continue;
            const inside = Util.dist(b.x, b.y, z.x, z.y) < z.radius + b.radius;
            if (!inside) continue;
            if (b.team !== z.team) {
              b.takeDamage(this, z.dmg * dt, z.owner, true);
              if (Math.random() < dt * 6) this.particles.sparkle(b.x, b.y, '#ff8c3a');
            } else if (z.healOwner && b === z.owner) {
              b.hp = Math.min(b.effMaxHp(), b.hp + 250 * dt);
            }
          }
          break;
        case 'mine':
          for (const b of this.brawlers) {
            if (b.team === z.team || !b.alive) continue;
            if (Util.dist(b.x, b.y, z.x, z.y) < z.radius + b.radius) {
              this.particles.explosion(z.x, z.y, 60, '#ff8c3a');
              AudioSys.sfx('explode');
              for (const e of this.brawlers) {
                if (e.team === z.team || !e.alive) continue;
                if (Util.dist(e.x, e.y, z.x, z.y) < 60 + e.radius) this.dealDamage(z.owner, e, z.dmg);
              }
              this.zones.splice(i, 1);
              break;
            }
          }
          break;
        case 'trap':
          for (const b of this.brawlers) {
            if (b.team === z.team || !b.alive) continue;
            if (Util.dist(b.x, b.y, z.x, z.y) < z.radius + b.radius) {
              b.rootT = z.rootDur;
              this.dealDamage(z.owner, b, z.dmg);
              this.particles.burst(z.x, z.y, 10, { color: '#4a8a2a', maxSpeed: 90, life: 0.4 });
              this.zones.splice(i, 1);
              break;
            }
          }
          break;
      }
    }
  }

  /* ---------- Raccoglibili ---------- */
  updatePickups(dt) {
    for (let i = this.pickups.length - 1; i >= 0; i--) {
      const p = this.pickups[i];
      if (p.spawnT > 0) { p.spawnT -= dt; continue; }
      for (const b of this.brawlers) {
        if (!b.alive || b.staticEntity) continue;
        if (Util.dist(b.x, b.y, p.x, p.y) < b.radius + 14) {
          if (p.type === 'gem') {
            b.gems++;
            AudioSys.sfx('gem');
            if (b === this.player) this.matchGems = (this.matchGems || 0) + 1;
          } else if (p.type === 'cube') {
            b.cubes++;
            b.hp = Math.min(b.effMaxHp(), b.hp + 400);
            AudioSys.sfx('cube');
          } else if (p.type === 'heal') {
            b.heal(this, 800);
          }
          this.particles.burst(p.x, p.y, 8, { color: p.type === 'gem' ? '#b78aff' : '#c66eff', maxSpeed: 90, life: 0.4, glow: true });
          this.pickups.splice(i, 1);
          break;
        }
      }
    }
  }

  /* ---------- Update principale (timestep fisso) ---------- */
  update(dt) {
    this.time += dt;
    this.particles.update(dt);
    this.shakeAmt = Math.max(0, this.shakeAmt - dt * 30);
    if (this.announceT > 0) this.announceT -= dt;

    /* Countdown iniziale */
    if (this.countdown > 0) {
      this.countdown -= dt;
      const c = Math.ceil(this.countdown);
      if (c !== this.lastCount && c > 0) { this.lastCount = c; AudioSys.sfx('count'); }
      if (this.countdown <= 0) { this.active = true; AudioSys.sfx('go'); this.announce(this.map.name); }
      this.updateCamera(dt);
      return;
    }

    /* Fine partita: breve pausa poi risultati */
    if (this.finished) {
      this.endTimer -= dt;
      /* Slow motion drammatico */
      const sdt = dt * 0.35;
      for (const b of this.brawlers) b.update(this, sdt);
      this.updateProjectiles(sdt);
      this.updateCamera(dt);
      if (this.endTimer <= 0) Menus.showResults(this, this.endResult);
      return;
    }

    /* Input giocatore: joystick oppure tastiera */
    const p = this.player;
    if (p.alive) {
      const km = this.hud.keyboardMove();
      const mv = (km.x || km.y) ? km : this.hud.move;
      p.moveX = mv.x; p.moveY = mv.y;
      /* Fuoco automatico opzionale */
      if (Save.state.settings.autoFire && p.canAttack()) {
        const ang = this.autoAimAngle(p);
        if (ang !== null) p.attack(this, ang);
      }
    }

    /* IA dei bot */
    for (const b of this.brawlers) {
      if (b.brain && b.alive) b.brain.update(this, dt);
    }
    /* Entità */
    for (const b of this.brawlers) b.update(this, dt);
    this.updateProjectiles(dt);
    this.updateZones(dt);
    this.updatePickups(dt);

    /* Regole della modalità */
    this.mode.update(this, dt);
    const end = this.mode.checkEnd(this);
    if (end && !this.finished) this.finish(end);

    this.updateCamera(dt);
  }

  finish(result) {
    this.finished = true;
    this.active = false;
    this.endTimer = result.quit ? 0 : 1.6;
    this.endResult = result;
    AudioSys.sfx(result.win ? 'win' : 'lose');
  }

  /* ---------- Camera ---------- */
  updateCamera(dt) {
    /* Zoom: ~460 unità mondo sul lato corto, ma mai oltre i bordi mappa */
    const w = this.canvas.clientWidth || 800;
    const h = this.canvas.clientHeight || 450;
    this.zoom = Math.max(Math.min(w, h) / 460, w / this.map.pixelW, h / this.map.pixelH);
    this.viewW = w / this.zoom;
    this.viewH = h / this.zoom;

    const target = this.player;
    let tx = target.x - this.viewW / 2, ty = target.y - this.viewH / 2;
    tx = Util.clamp(tx, 0, Math.max(0, this.map.pixelW - this.viewW));
    ty = Util.clamp(ty, 0, Math.max(0, this.map.pixelH - this.viewH));
    this.camTargetX = tx; this.camTargetY = ty;
    this.cam.x = Util.lerp(this.cam.x, tx, Math.min(1, dt * 7));
    this.cam.y = Util.lerp(this.cam.y, ty, Math.min(1, dt * 7));
  }

  /* ---------- Rendering ---------- */
  render(ctx, w, h) {
    const zoom = this.zoom || 1;
    /* Pulizia esplicita: lo sfondo scuro riempie le zone fuori mappa */
    ctx.fillStyle = '#0a0e28';
    ctx.fillRect(0, 0, w, h);

    ctx.save();
    ctx.scale(zoom, zoom);
    /* Shake della camera */
    const sx = this.shakeAmt ? Util.rand(-this.shakeAmt, this.shakeAmt) : 0;
    const sy = this.shakeAmt ? Util.rand(-this.shakeAmt, this.shakeAmt) : 0;
    ctx.translate(-this.cam.x + sx, -this.cam.y + sy);

    /* Mondo */
    this.map.draw(ctx, this.cam, this.viewW, this.viewH);
    this.mode.drawWorld(ctx, this);

    /* Zone ad area */
    for (const z of this.zones) this.drawZone(ctx, z);

    /* Raccoglibili */
    for (const p of this.pickups) p.draw(ctx, this.time);

    /* Indicatore di mira manuale del giocatore */
    if (this.hud.aim && this.hud.aim.dragged && this.player.alive) {
      const a = this.hud.aim;
      const range = a.type === 'super' ? (this.player.def.super.range || 220) : this.player.def.attack.range;
      ctx.strokeStyle = a.type === 'super' ? 'rgba(255,225,77,.8)' : 'rgba(255,255,255,.65)';
      ctx.lineWidth = 3;
      ctx.setLineDash([10, 8]);
      ctx.beginPath();
      ctx.moveTo(this.player.x, this.player.y);
      ctx.lineTo(this.player.x + Math.cos(a.ang) * range, this.player.y + Math.sin(a.ang) * range);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.arc(this.player.x + Math.cos(a.ang) * range, this.player.y + Math.sin(a.ang) * range,
        this.player.def.attack.type === 'lob' ? this.player.def.attack.radius : 12, 0, TAU);
      ctx.stroke();
    }

    /* Entità ordinate per Y (pseudo-profondità) */
    const sorted = this.brawlers.slice().sort((a, b) => a.y - b.y);
    for (const b of sorted) {
      /* Nemici invisibili nei cespugli: salta il disegno */
      if (b.team !== this.playerTeam && b.alive && !b.visibleTo(this, this.player)) continue;
      b.draw(ctx, this);
    }

    /* Proiettili */
    for (const pr of this.projectiles) this.drawProjectile(ctx, pr);

    /* Particelle sopra a tutto */
    this.particles.draw(ctx);

    ctx.restore();

    /* --- Overlay in coordinate schermo --- */
    if (this.countdown > 0) {
      ctx.fillStyle = 'rgba(6,8,24,.45)';
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#ffe14d';
      ctx.font = `bold ${Math.min(w, h) * 0.22}px 'Trebuchet MS', sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const c = Math.ceil(this.countdown);
      const frac = 1 - (this.countdown - Math.floor(this.countdown));
      ctx.save();
      ctx.translate(w / 2, h / 2);
      ctx.scale(0.6 + frac * 0.5, 0.6 + frac * 0.5);
      ctx.fillText(c > 0 ? String(c) : 'GO!', 0, 0);
      ctx.restore();
      ctx.textBaseline = 'alphabetic';
    } else if (this.announceT > 0) {
      ctx.globalAlpha = Math.min(1, this.announceT);
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${Math.min(w, h) * 0.06}px 'Trebuchet MS', sans-serif`;
      ctx.textAlign = 'center';
      ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.lineWidth = 5;
      ctx.strokeText(this.announceText, w / 2, h * 0.24);
      ctx.fillText(this.announceText, w / 2, h * 0.24);
      ctx.globalAlpha = 1;
    }

    /* HUD */
    this.hud.draw(ctx, this);
  }

  drawZone(ctx, z) {
    const colors = {
      heal: ['rgba(74,224,110,.2)', '#4ae06e'], totem: ['rgba(66,245,200,.2)', '#42f5c8'],
      frost: ['rgba(110,198,255,.28)', '#6ec6ff'], storm: ['rgba(245,230,66,.18)', '#f5e642'],
      fire: ['rgba(255,90,58,.3)', '#ff5a3a'], mine: ['rgba(255,140,58,.15)', '#ff8c3a'],
      trap: ['rgba(74,138,42,.15)', '#4a8a2a']
    };
    const [fill, stroke] = colors[z.type] || colors.heal;
    /* Mine e trappole nemiche sono invisibili al giocatore */
    if ((z.type === 'mine' || z.type === 'trap') && z.team !== this.playerTeam) return;
    ctx.fillStyle = fill;
    ctx.beginPath(); ctx.arc(z.x, z.y, z.radius, 0, TAU); ctx.fill();
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.6 + 0.3 * Math.sin(this.time * 4);
    ctx.beginPath(); ctx.arc(z.x, z.y, z.radius - 2, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
    /* Icona al centro */
    const icons = { heal: '➕', totem: '🗿', frost: '❄️', storm: '⛈️', fire: '', mine: '💣', trap: '🕸️' };
    if (icons[z.type]) {
      ctx.font = '16px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(icons[z.type], z.x, z.y + 5);
    }
  }

  drawProjectile(ctx, pr) {
    ctx.save();
    if (pr.lob) {
      /* Parabola: ombra a terra + proiettile in "volo" */
      const t = pr.traveled / pr.range;
      const height = Math.sin(t * Math.PI) * 46;
      ctx.fillStyle = 'rgba(0,0,0,.3)';
      ctx.beginPath(); ctx.ellipse(pr.x, pr.y, 7, 4, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = pr.color;
      ctx.shadowColor = pr.color; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(pr.x, pr.y - height, pr.radius, 0, TAU); ctx.fill();
    } else {
      ctx.fillStyle = pr.color;
      ctx.shadowColor = pr.color; ctx.shadowBlur = 10;
      ctx.translate(pr.x, pr.y);
      ctx.rotate(pr.ang);
      ctx.beginPath();
      ctx.ellipse(0, 0, pr.radius * 1.7, pr.radius * 0.8, 0, 0, TAU);
      ctx.fill();
      /* nucleo bianco */
      ctx.fillStyle = 'rgba(255,255,255,.8)';
      ctx.beginPath(); ctx.ellipse(2, 0, pr.radius * 0.8, pr.radius * 0.4, 0, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
}

/* ===== js/menus.js ===== */
/* ============================================================
   menus.js — Interfaccia utente DOM.
   Home/lobby, selezione modalità e brawler, negozio, missioni,
   Nova Pass, classifica, profilo, impostazioni, risultati.
   ============================================================ */
'use strict';

const Menus = {
  current: 'home',

  init() {
    /* Navigazione con data-nav */
    document.querySelectorAll('[data-nav]').forEach(el => {
      el.addEventListener('click', () => {
        AudioSys.init();
        AudioSys.sfx('ui');
        this.show(el.dataset.nav);
      });
    });
    document.getElementById('btn-play').addEventListener('click', () => {
      AudioSys.init();
      this.startMatch();
    });
    document.getElementById('btn-results-ok').addEventListener('click', () => {
      AudioSys.sfx('ui');
      this.show('home');
    });
    this.show('home');
  },

  /* Mostra una schermata e nasconde le altre */
  show(name) {
    this.current = name;
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    const el = document.getElementById('screen-' + name);
    if (el) el.classList.remove('hidden');
    document.getElementById('ui-root').style.display = '';
    AudioSys.music('menu');

    switch (name) {
      case 'home': this.renderHome(); break;
      case 'modes': this.renderModes(); break;
      case 'brawlers': this.renderBrawlers(); break;
      case 'shop': this.renderShop(); break;
      case 'quests': this.renderQuests(); break;
      case 'pass': this.renderPass(); break;
      case 'ranking': this.renderRanking(); break;
      case 'profile': this.renderProfile(); break;
      case 'settings': this.renderSettings(); break;
    }
  },

  toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(this._toastT);
    this._toastT = setTimeout(() => t.classList.remove('show'), 2200);
  },

  /* ---------- Ritratto di un brawler su canvas ---------- */
  drawPortrait(canvas, def, color) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    const cx = w / 2, cy = h / 2, r = Math.min(w, h) * 0.34;
    /* Aura */
    const aura = ctx.createRadialGradient(cx, cy, r * 0.5, cx, cy, r * 1.5);
    aura.addColorStop(0, color + '55');
    aura.addColorStop(1, 'transparent');
    ctx.fillStyle = aura;
    ctx.fillRect(0, 0, w, h);
    /* Ombra */
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.beginPath(); ctx.ellipse(cx, cy + r * 1.15, r * 0.9, r * 0.25, 0, 0, TAU); ctx.fill();
    /* Corpo */
    const g = ctx.createRadialGradient(cx - r * 0.4, cy - r * 0.5, 4, cx, cy, r * 1.1);
    g.addColorStop(0, Util.shade(color, 0.4));
    g.addColorStop(1, color);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.5)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
    /* Occhi */
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(cx - r * 0.32, cy - r * 0.15, r * 0.22, 0, TAU);
    ctx.arc(cx + r * 0.32, cy - r * 0.15, r * 0.22, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#1a1a2e';
    ctx.beginPath();
    ctx.arc(cx - r * 0.28, cy - r * 0.12, r * 0.1, 0, TAU);
    ctx.arc(cx + r * 0.36, cy - r * 0.12, r * 0.1, 0, TAU);
    ctx.fill();
    /* Sorriso */
    ctx.strokeStyle = '#1a1a2e';
    ctx.lineWidth = r * 0.08;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(cx, cy + r * 0.25, r * 0.3, 0.25, Math.PI - 0.25);
    ctx.stroke();
  },

  /* ---------- Negozio ---------- */
  renderShop() {
    const grid = document.getElementById('shop-grid');
    grid.innerHTML = '';
    const day = Math.floor(Date.now() / 86400000);
    for (const item of SHOP_ITEMS) {
      const card = document.createElement('div');
      const soldOut = (item.daily && Save.state.shopDaily === day) ||
                      (!item.daily && Save.state.shopBought.includes(item.id) && item.give.random !== true);
      card.className = 'shop-card' + (soldOut ? ' bought' : '');
      const price = item.priceGems ? `💎 ${item.priceGems}` : item.priceCoins ? `🪙 ${item.priceCoins}` : 'GRATIS';
      card.innerHTML = `<div class="sc-ico">${item.icon}</div>
        <div class="sc-name">${item.name}</div>
        <div class="sc-desc" style="font-size:11px;opacity:.7">${item.desc}</div>
        <div class="sc-price">${soldOut ? 'RISCATTATO' : price}</div>`;
      card.addEventListener('click', () => {
        if (soldOut) { this.toast('Torna domani!'); return; }
        this.buyItem(item, day);
      });
      grid.appendChild(card);
    }
  },

  buyItem(item, day) {
    if (item.priceGems && !Save.spendGems(item.priceGems)) { this.toast('Gemme insufficienti!'); return; }
    if (item.priceCoins && !Save.spendCoins(item.priceCoins)) { this.toast('Monete insufficienti!'); return; }
    let msg = '';
    if (item.give.random) {
      /* Nova Box: ricompensa casuale */
      const roll = Math.random();
      if (roll < 0.5) { const n = Util.irand(40, 120); Save.addCoins(n); msg = `+${n} monete!`; }
      else if (roll < 0.85) { const n = Util.irand(30, 90); Save.addPP(n); msg = `+${n} punti potere!`; }
      else { const n = Util.irand(5, 15); Save.addGems(n); msg = `+${n} gemme! ✨`; }
    } else {
      if (item.give.coins) { Save.addCoins(item.give.coins); msg = `+${item.give.coins} monete!`; }
      if (item.give.pp) { Save.addPP(item.give.pp); msg = `+${item.give.pp} punti potere!`; }
      if (item.give.gems) { Save.addGems(item.give.gems); msg = `+${item.give.gems} gemme!`; }
      if (item.daily) Save.state.shopDaily = day;
      else Save.state.shopBought.push(item.id);
      Save.save();
    }
    AudioSys.sfx('buy');
    this.toast(msg);
    this.renderShop();
    this.renderHome();
  },

  /* ---------- Avvio partita ---------- */
  startMatch() {
    if (!Save.isUnlocked(Save.state.selectedBrawler)) {
      this.toast('Questo brawler è bloccato!');
      return;
    }
    AudioSys.sfx('go');
    document.getElementById('ui-root').style.display = 'none';
    window.game = new Game(Save.state.selectedMode, document.getElementById('game-canvas'), window.hud);
    window.hud.relayout(window.innerWidth, window.innerHeight);
    /* Mini tutorial alla prima partita */
    if (!Save.state.tutorialDone) {
      Save.state.tutorialDone = true;
      Save.save();
      setTimeout(() => { if (window.game) window.game.announce('Joystick a sinistra · Attacca a destra ⚔️'); }, 3500);
      setTimeout(() => { if (window.game) window.game.announce('Trascina ⚔️ per mirare · ★ = Super!'); }, 6500);
    }
  },

  /* ---------- Risultati ---------- */
  showResults(game, result) {
    const p = game.player;
    const rewards = Save.applyMatchResult({
      win: !!result.win, draw: !!result.draw, rank: result.rank,
      kills: p.kills, deaths: p.deaths, damage: Math.round(p.dmgDealt),
      gems: game.matchGems || 0, supers: p.supersUsed,
      modeId: game.modeId, brawlerId: p.def.id
    });
    window.game = null;
    document.getElementById('ui-root').style.display = '';
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    document.getElementById('screen-results').classList.remove('hidden');

    const title = document.getElementById('res-title');
    if (result.rank !== undefined && !result.win) {
      title.textContent = `#${result.rank} POSTO`;
      title.style.color = result.rank <= 4 ? '#ffe14d' : '#ff6a6a';
    } else {
      title.textContent = result.win ? 'VITTORIA! 🏆' : result.draw ? 'PAREGGIO' : 'SCONFITTA';
      title.style.color = result.win ? '#ffe14d' : result.draw ? '#c8d0ff' : '#ff6a6a';
    }
    const sign = rewards.trophies >= 0 ? '+' : '';
    document.getElementById('res-rows').innerHTML = `
      <div class="res-row"><span>Trofei</span><b>${sign}${rewards.trophies} 🏆</b></div>
      <div class="res-row"><span>Monete</span><b>+${rewards.coins} 🪙</b></div>
      <div class="res-row"><span>Esperienza</span><b>+${rewards.xp} XP</b></div>
      <div class="res-row"><span>Eliminazioni</span><b>${p.kills}</b></div>
      <div class="res-row"><span>Danni inflitti</span><b>${Util.fmt(Math.round(p.dmgDealt))}</b></div>
      ${game.matchGems ? `<div class="res-row"><span>Gemme raccolte</span><b>${game.matchGems} 💎</b></div>` : ''}`;
    AudioSys.music('menu');
  }
};

/* ===== js/main.js ===== */
/* ============================================================
   main.js — Bootstrap e game loop.
   Timestep fisso a 60 Hz per la simulazione + rendering a
   frequenza dello schermo (supporta 90/120/144 Hz nativamente
   tramite requestAnimationFrame). Canvas in scala DPR.
   ============================================================ */
'use strict';

(function () {
  const canvas = document.getElementById('game-canvas');
  const ctx = canvas.getContext('2d');
  let cssW = 0, cssH = 0;

  /* ---------- Resize con supporto Retina/alta densità ---------- */
  function resize() {
    cssW = window.innerWidth;
    cssH = window.innerHeight;
    /* In qualità bassa limitiamo il DPR per risparmiare GPU */
    const maxDpr = (Save.state && Save.state.settings.quality === 'bassa') ? 1 : 2;
    const dpr = Math.min(window.devicePixelRatio || 1, maxDpr);
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (window.hud) window.hud.relayout(cssW, cssH);
  }

  /* ---------- Inizializzazione ---------- */
  Save.load();
  window.hud = new HUD(canvas);
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));
  Menus.init();

  /* Primo tocco/click: sblocca l'audio (richiesto da iOS/Android) */
  const unlock = () => { AudioSys.init(); AudioSys.music(Menus.current === 'home' ? 'menu' : AudioSys.currentTrack); };
  window.addEventListener('pointerdown', unlock, { once: true });

  /* Pausa quando l'app va in background (risparmio batteria) */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) AudioSys.stopMusic();
    else { const t = AudioSys.currentTrack; AudioSys.currentTrack = null; AudioSys.music(t); }
  });

  /* ---------- Game loop ---------- */
  const STEP = 1 / 60;          // timestep fisso della simulazione
  let last = performance.now();
  let acc = 0;
  let fpsTime = 0, fpsCount = 0;

  function frame(now) {
    requestAnimationFrame(frame);
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.25) dt = 0.25;   // evita "spiral of death" dopo una pausa

    /* Contatore FPS */
    fpsCount++;
    fpsTime += dt;
    if (fpsTime >= 0.5) {
      if (window.game) window.game.fps = fpsCount / fpsTime;
      fpsCount = 0; fpsTime = 0;
    }

    const g = window.game;
    if (!g) {
      /* Nei menu il canvas mostra uno sfondo animato leggero */
      drawMenuBackground(now / 1000);
      return;
    }

    /* Simulazione a passi fissi, rendering a ogni frame */
    acc += dt;
    let steps = 0;
    while (acc >= STEP && steps < 4) {
      g.update(STEP);
      acc -= STEP;
      steps++;
      if (!window.game) return;   // la partita può terminare dentro update()
    }
    g.render(ctx, cssW, cssH);
  }

  /* Sfondo animato dei menu: stelle che scorrono */
  const stars = [];
  for (let i = 0; i < 60; i++) {
    stars.push({ x: Math.random(), y: Math.random(), s: Math.random() * 2 + 0.5, v: Math.random() * 0.02 + 0.005 });
  }
  function drawMenuBackground(t) {
    ctx.fillStyle = '#0e1230';
    ctx.fillRect(0, 0, cssW, cssH);
    for (const st of stars) {
      st.y += st.v / 60;
      if (st.y > 1) st.y = 0;
      ctx.globalAlpha = 0.3 + 0.3 * Math.sin(t * 2 + st.x * 10);
      ctx.fillStyle = '#8892c9';
      ctx.fillRect(st.x * cssW, st.y * cssH, st.s, st.s);
    }
    ctx.globalAlpha = 1;
  }

  requestAnimationFrame(frame);
})();

</script>
</body>
</html>
