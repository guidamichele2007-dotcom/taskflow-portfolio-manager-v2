<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Nova Brawl</title>
<style>
/* ============================================================
   Nova Brawl — Stile UI
   Design mobile-first, tema scuro con accenti neon.
   ============================================================ */

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #0e1230;
  font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
  color: #fff;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
  position: fixed;
}

#game-canvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  display: block;
  touch-action: none;
}

/* ---------- Radice UI ---------- */
#ui-root { position: absolute; inset: 0; pointer-events: none; }
.screen {
  position: absolute; inset: 0;
  pointer-events: auto;
  display: flex; flex-direction: column;
  background:
    radial-gradient(ellipse at 20% 0%, #22307a 0%, transparent 55%),
    radial-gradient(ellipse at 90% 100%, #4a1f6e 0%, transparent 50%),
    #0e1230;
  padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
           max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  animation: screen-in .22s ease-out;
}
.screen.hidden { display: none; }
@keyframes screen-in { from { opacity: 0; transform: scale(1.03); } to { opacity: 1; transform: none; } }

.screen-head {
  display: flex; align-items: center; gap: 12px;
  padding: 6px 0 12px 0; flex: 0 0 auto;
}
.screen-head h2 {
  font-size: 24px; letter-spacing: 1px; text-transform: uppercase;
  text-shadow: 0 3px 0 rgba(0,0,0,.4);
}
.back-btn {
  width: 44px; height: 44px; border-radius: 12px; border: none;
  background: linear-gradient(#3a4bbf, #26348a);
  color: #fff; font-size: 26px; font-weight: bold;
  box-shadow: 0 4px 0 #131b52; cursor: pointer;
}
.back-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #131b52; }

/* ---------- Home ---------- */
.home-top { display: flex; justify-content: space-between; align-items: flex-start; flex: 0 0 auto; }
.profile-chip {
  display: flex; gap: 10px; align-items: center;
  background: rgba(10,14,40,.7); border: 1px solid #3a4bbf;
  border-radius: 14px; padding: 6px 12px 6px 6px; cursor: pointer;
}
.avatar {
  width: 44px; height: 44px; border-radius: 10px;
  background: linear-gradient(#ffb400, #ff7a00);
  display: flex; align-items: center; justify-content: center; font-size: 24px;
}
.pname { font-weight: bold; font-size: 14px; }
.pxp {
  position: relative; width: 110px; height: 14px; margin-top: 3px;
  background: #131b52; border-radius: 7px; overflow: hidden;
  font-size: 10px; text-align: center; line-height: 14px;
}
.pxp-fill { position: absolute; inset: 0; width: 0%; background: linear-gradient(90deg,#26d9ff,#2a7bff); }
.pxp span { position: relative; }

.currency-bar { display: flex; gap: 8px; }
.currency {
  background: rgba(10,14,40,.7); border: 1px solid #3a4bbf; border-radius: 12px;
  padding: 8px 14px; font-weight: bold; font-size: 15px;
  display: flex; align-items: center; gap: 6px;
}

.home-center { flex: 1; display: flex; align-items: center; justify-content: center; }
.brawler-portrait { text-align: center; cursor: pointer; }
.brawler-portrait canvas {
  filter: drop-shadow(0 12px 24px rgba(0,0,0,.5));
  animation: float 3s ease-in-out infinite;
}
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
.portrait-name {
  font-size: 28px; font-weight: 900; letter-spacing: 2px;
  text-shadow: 0 3px 0 rgba(0,0,0,.5), 0 0 22px #26d9ff;
}
.portrait-hint { font-size: 12px; opacity: .6; margin-top: 4px; }

.home-bottom {
  flex: 0 0 auto; display: flex; gap: 12px; align-items: stretch;
  justify-content: center; padding-bottom: 6px;
}
.mode-select {
  display: flex; align-items: center; gap: 10px;
  background: linear-gradient(#2a3aa0, #1c2870);
  border: 2px solid #4a5de0; border-radius: 16px;
  color: #fff; padding: 10px 18px; font-size: 16px; font-weight: bold; cursor: pointer;
  box-shadow: 0 5px 0 #10173f;
}
.mode-select:active { transform: translateY(3px); box-shadow: 0 2px 0 #10173f; }
.mode-ico { font-size: 24px; }
.mode-change { font-size: 11px; opacity: .7; }

.play-btn {
  background: linear-gradient(#ffe14d, #ffb400);
  border: none; border-radius: 16px;
  color: #5a3800; font-size: 26px; font-weight: 900; letter-spacing: 2px;
  padding: 10px 46px; cursor: pointer;
  box-shadow: 0 6px 0 #a86e00, 0 0 30px rgba(255,190,0,.35);
  text-shadow: 0 1px 0 rgba(255,255,255,.4);
}
.play-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #a86e00; }

.home-side {
  position: absolute; left: max(12px, env(safe-area-inset-left)); top: 56%;
  transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 8px;
  max-height: 72%; overflow-y: auto;
}
.side-btn {
  width: 64px; padding: 8px 4px; border-radius: 14px; border: 1px solid #3a4bbf;
  background: rgba(10,14,40,.75); color: #fff; font-size: 20px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.side-btn span { font-size: 10px; opacity: .8; }
.side-btn:active { background: #2a3aa0; }

/* ---------- Liste e griglie ---------- */
.scroll-list, .scroll-grid {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch; touch-action: pan-y;
  padding-bottom: 20px;
}
.scroll-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }

.mode-card {
  display: flex; align-items: center; gap: 14px;
  background: rgba(20,26,70,.85); border: 2px solid #2a3aa0; border-radius: 16px;
  padding: 14px; margin-bottom: 10px; cursor: pointer; color: #fff; width: 100%;
  text-align: left;
}
.mode-card.active { border-color: #ffe14d; box-shadow: 0 0 18px rgba(255,225,77,.25); }
.mode-card .mc-ico { font-size: 34px; }
.mode-card .mc-name { font-size: 18px; font-weight: bold; }
.mode-card .mc-desc { font-size: 12px; opacity: .7; }

.brawler-card {
  background: rgba(20,26,70,.85); border: 2px solid #2a3aa0; border-radius: 16px;
  padding: 10px; text-align: center; cursor: pointer; color: #fff; position: relative;
}
.brawler-card.locked { filter: grayscale(1) brightness(.55); }
.brawler-card.selected { border-color: #26d9ff; box-shadow: 0 0 16px rgba(38,217,255,.3); }
.brawler-card canvas { width: 80px; height: 80px; }
.brawler-card .bc-name { font-weight: bold; font-size: 13px; }
.brawler-card .bc-class { font-size: 10px; opacity: .65; }
.brawler-card .bc-trophies { font-size: 11px; color: #ffe14d; }
.brawler-card .bc-lock { position: absolute; top: 6px; right: 8px; }

/* ---------- Dettaglio brawler ---------- */
.bd-body { flex: 1; overflow-y: auto; touch-action: pan-y; text-align: center; }
.bd-stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 10px 0; }
.stat-box {
  background: rgba(20,26,70,.85); border-radius: 10px; padding: 8px 14px;
  font-size: 12px; min-width: 90px;
}
.stat-box b { display: block; font-size: 16px; color: #26d9ff; }
.bd-abilities { text-align: left; max-width: 560px; margin: 0 auto; }
.ability-row {
  display: flex; gap: 10px; background: rgba(20,26,70,.85);
  border-radius: 12px; padding: 10px; margin-bottom: 8px; align-items: center;
}
.ability-row .ab-ico { font-size: 26px; width: 40px; text-align: center; }
.ability-row .ab-name { font-weight: bold; font-size: 14px; }
.ability-row .ab-desc { font-size: 12px; opacity: .75; }
.bd-skins { display: flex; gap: 8px; justify-content: center; margin: 12px 0; flex-wrap: wrap; }
.skin-chip {
  padding: 8px 14px; border-radius: 10px; border: 2px solid #2a3aa0;
  background: rgba(20,26,70,.85); color: #fff; cursor: pointer; font-size: 13px;
}
.skin-chip.owned { border-color: #4ae06e; }
.skin-chip.active { border-color: #ffe14d; }
.bd-actions { display: flex; gap: 10px; justify-content: center; margin: 14px 0 30px; }
.action-btn {
  padding: 12px 26px; border-radius: 14px; border: none; cursor: pointer;
  background: linear-gradient(#3a4bbf, #26348a); color: #fff;
  font-size: 16px; font-weight: bold; box-shadow: 0 4px 0 #131b52;
}
.action-btn.primary { background: linear-gradient(#ffe14d, #ffb400); color: #5a3800; box-shadow: 0 4px 0 #a86e00; }
.action-btn:active { transform: translateY(3px); box-shadow: none; }
.action-btn:disabled { opacity: .45; }

/* ---------- Negozio / missioni / pass ---------- */
.shop-card {
  background: rgba(20,26,70,.85); border: 2px solid #2a3aa0; border-radius: 16px;
  padding: 14px 10px; text-align: center; cursor: pointer; color: #fff;
}
.shop-card .sc-ico { font-size: 36px; }
.shop-card .sc-name { font-weight: bold; font-size: 13px; margin: 6px 0; }
.shop-card .sc-price { color: #ffe14d; font-weight: bold; font-size: 14px; }
.shop-card.bought { filter: grayscale(.8) brightness(.6); }

.quest-row {
  background: rgba(20,26,70,.85); border-radius: 14px; padding: 12px;
  margin-bottom: 10px; display: flex; align-items: center; gap: 12px;
}
.quest-row .q-ico { font-size: 28px; }
.quest-row .q-name { font-weight: bold; font-size: 14px; }
.quest-row .q-bar {
  height: 10px; background: #131b52; border-radius: 5px; margin-top: 6px;
  overflow: hidden; width: 100%;
}
.quest-row .q-fill { height: 100%; background: linear-gradient(90deg,#4ae06e,#26d9ff); width: 0%; }
.quest-row .q-reward { font-size: 13px; color: #ffe14d; white-space: nowrap; }
.quest-row.done { border: 1px solid #4ae06e; }

.pass-progress {
  position: relative; height: 26px; background: #131b52; border-radius: 13px;
  margin-bottom: 12px; overflow: hidden; text-align: center; line-height: 26px;
  font-weight: bold; flex: 0 0 auto;
}
.pass-fill { position: absolute; inset: 0; width: 0%; background: linear-gradient(90deg,#ff7a00,#ffe14d); }
.pass-progress span { position: relative; }
.pass-row {
  display: flex; align-items: center; gap: 12px;
  background: rgba(20,26,70,.85); border-radius: 14px; padding: 12px; margin-bottom: 8px;
}
.pass-row.claimed { opacity: .5; }
.pass-row.claimable { border: 2px solid #ffe14d; }
.pass-row .pr-tier { font-weight: 900; font-size: 18px; width: 60px; }

.rank-row {
  display: flex; align-items: center; gap: 12px;
  background: rgba(20,26,70,.85); border-radius: 12px; padding: 10px 14px; margin-bottom: 6px;
}
.rank-row .rr-pos { font-weight: 900; width: 34px; font-size: 16px; color: #ffe14d; }
.rank-row.me { border: 2px solid #26d9ff; }

/* ---------- Impostazioni ---------- */
.setting-row {
  display: flex; justify-content: space-between; align-items: center;
  background: rgba(20,26,70,.85); border-radius: 12px; padding: 14px; margin-bottom: 8px;
}
.toggle {
  width: 56px; height: 30px; border-radius: 15px; border: none; cursor: pointer;
  background: #131b52; position: relative; transition: background .15s;
}
.toggle::after {
  content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px;
  border-radius: 50%; background: #8892c9; transition: all .15s;
}
.toggle.on { background: #2aa84a; }
.toggle.on::after { left: 29px; background: #fff; }

/* ---------- Risultati ---------- */
#screen-results { background: rgba(6,8,24,.85); align-items: center; justify-content: center; }
.results-card {
  background: linear-gradient(#1c2870, #131b52);
  border: 3px solid #3a4bbf; border-radius: 24px;
  padding: 26px 34px; text-align: center; min-width: 300px;
  animation: pop-in .3s cubic-bezier(.34,1.56,.64,1);
}
@keyframes pop-in { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
.results-card h1 {
  font-size: 34px; letter-spacing: 3px; margin-bottom: 14px;
  text-shadow: 0 0 24px rgba(255,225,77,.5);
}
.res-rows { margin-bottom: 18px; }
.res-row { display: flex; justify-content: space-between; gap: 30px; padding: 5px 0; font-size: 15px; }
.res-row b { color: #ffe14d; }

/* ---------- Toast ---------- */
#toast {
  position: absolute; top: 14%; left: 50%; transform: translateX(-50%) translateY(-20px);
  background: rgba(12,16,44,.95); border: 1px solid #3a4bbf; color: #fff;
  padding: 10px 22px; border-radius: 12px; font-size: 14px; font-weight: bold;
  opacity: 0; pointer-events: none; transition: all .25s; z-index: 50;
  max-width: 80%; text-align: center;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- Layout orizzontale stretto ---------- */
@media (max-height: 420px) {
  .brawler-portrait canvas { width: 130px; height: 130px; }
  .portrait-name { font-size: 20px; }
  .home-side { gap: 4px; }
  .side-btn { width: 54px; font-size: 16px; padding: 5px 2px; }
}

</style>

<script>
/* ===== js/util.js ===== */
/* ============================================================
   util.js — Funzioni matematiche, vettori, RNG, pooling.
   Tutto il progetto usa questi helper condivisi.
   ============================================================ */
'use strict';

const TAU = Math.PI * 2;

const Util = {
  /* Limita v nell'intervallo [a, b] */
  clamp(v, a, b) { return v < a ? a : (v > b ? b : v); },

  /* Interpolazione lineare */
  lerp(a, b, t) { return a + (b - a) * t; },

  /* Distanza euclidea */
  dist(x1, y1, x2, y2) { const dx = x2 - x1, dy = y2 - y1; return Math.sqrt(dx * dx + dy * dy); },
  dist2(x1, y1, x2, y2) { const dx = x2 - x1, dy = y2 - y1; return dx * dx + dy * dy; },

  /* Angolo da (x1,y1) verso (x2,y2) */
  angTo(x1, y1, x2, y2) { return Math.atan2(y2 - y1, x2 - x1); },

  /* Interpolazione angolare (percorso più corto) */
  lerpAng(a, b, t) {
    let d = (b - a) % TAU;
    if (d > Math.PI) d -= TAU;
    if (d < -Math.PI) d += TAU;
    return a + d * t;
  },

  /* Random float in [a, b) */
  rand(a, b) { return a + Math.random() * (b - a); },

  /* Random intero in [a, b] inclusi */
  irand(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); },

  /* Elemento casuale di un array */
  choice(arr) { return arr[Math.floor(Math.random() * arr.length)]; },

  /* Mescola un array in place (Fisher-Yates) */
  shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  },

  /* RNG deterministico (mulberry32) — usato per generare mappe ripetibili */
  seededRng(seed) {
    let s = seed >>> 0;
    return function () {
      s |= 0; s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  },

  /* Formatta numeri grandi: 12500 -> "12.5K" */
  fmt(n) {
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e4) return (n / 1e3).toFixed(1) + 'K';
    return String(Math.floor(n));
  },

  /* Schiarisce/scurisce un colore hex di una quantità [-1, 1] */
  shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    if (amt >= 0) { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
    else { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
    return `rgb(${r | 0},${g | 0},${b | 0})`;
  },

  /* Easing */
  easeOut(t) { return 1 - (1 - t) * (1 - t); },
  easeIn(t) { return t * t; },

  /* Vibrazione (dove supportata: Android Chrome, wrapper Capacitor) */
  vibrate(ms) {
    try { if (navigator.vibrate && Save.state.settings.vibration) navigator.vibrate(ms); } catch (e) { /* no-op */ }
  }
};

/* ------------------------------------------------------------
   Pool di oggetti generico: riduce la pressione sul GC durante
   la partita (proiettili e particelle vengono riciclati).
   ------------------------------------------------------------ */
class Pool {
  constructor(factory) {
    this.factory = factory;
    this.items = [];       // oggetti liberi pronti al riuso
  }
  get() { return this.items.pop() || this.factory(); }
  release(obj) { if (this.items.length < 512) this.items.push(obj); }
}

/* ===== js/audio.js ===== */
/* ============================================================
   audio.js — Sistema audio completo basato su WebAudio.
   Nessun file esterno: effetti sonori e musica sono
   sintetizzati proceduralmente (zero download, zero licenze).
   ============================================================ */
'use strict';

const AudioSys = {
  ctx: null,
  master: null,
  musicGain: null,
  sfxGain: null,
  musicTimer: null,
  currentTrack: null,
  step: 0,

  /* L'AudioContext può partire solo dopo un gesto utente:
     init() viene richiamata al primo tocco. */
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.connect(this.ctx.destination);
    this.musicGain = this.ctx.createGain();
    this.musicGain.gain.value = 0.35;
    this.musicGain.connect(this.master);
    this.sfxGain = this.ctx.createGain();
    this.sfxGain.gain.value = 0.8;
    this.sfxGain.connect(this.master);
    this.applySettings();
  },

  applySettings() {
    if (!this.ctx) return;
    const s = Save.state.settings;
    this.musicGain.gain.value = s.music ? 0.32 : 0;
    this.sfxGain.gain.value = s.sfx ? 0.8 : 0;
  },

  /* ---------- Sintesi di un singolo suono ---------- */
  tone(opts) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = opts.type || 'square';
    o.frequency.setValueAtTime(opts.f0 || 440, t);
    if (opts.f1) o.frequency.exponentialRampToValueAtTime(Math.max(20, opts.f1), t + (opts.dur || 0.15));
    g.gain.setValueAtTime(opts.vol || 0.3, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + (opts.dur || 0.15));
    o.connect(g); g.connect(opts.music ? this.musicGain : this.sfxGain);
    o.start(t); o.stop(t + (opts.dur || 0.15) + 0.02);
  },

  /* Rumore bianco filtrato: esplosioni, passi, hit */
  noise(opts) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const dur = opts.dur || 0.2;
    const len = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const filt = this.ctx.createBiquadFilter();
    filt.type = opts.filter || 'lowpass';
    filt.frequency.setValueAtTime(opts.f0 || 1000, t);
    if (opts.f1) filt.frequency.exponentialRampToValueAtTime(Math.max(40, opts.f1), t + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(opts.vol || 0.3, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(filt); filt.connect(g); g.connect(this.sfxGain);
    src.start(t);
  },

  /* ---------- Libreria effetti sonori ---------- */
  sfx(name) {
    if (!this.ctx || !Save.state.settings.sfx) return;
    switch (name) {
      case 'shoot':   this.tone({ type: 'square', f0: 700, f1: 240, dur: 0.09, vol: 0.16 }); break;
      case 'shoot2':  this.tone({ type: 'sawtooth', f0: 420, f1: 160, dur: 0.12, vol: 0.15 }); break;
      case 'lob':     this.tone({ type: 'sine', f0: 300, f1: 640, dur: 0.2, vol: 0.2 }); break;
      case 'melee':   this.noise({ f0: 2400, f1: 500, dur: 0.09, vol: 0.25, filter: 'bandpass' }); break;
      case 'hit':     this.tone({ type: 'triangle', f0: 220, f1: 90, dur: 0.08, vol: 0.3 }); break;
      case 'explode': this.noise({ f0: 900, f1: 80, dur: 0.4, vol: 0.5 });
                      this.tone({ type: 'sine', f0: 120, f1: 40, dur: 0.35, vol: 0.4 }); break;
      case 'super':   this.tone({ type: 'sawtooth', f0: 180, f1: 900, dur: 0.35, vol: 0.35 });
                      this.noise({ f0: 3000, f1: 400, dur: 0.3, vol: 0.2 }); break;
      case 'death':   this.tone({ type: 'square', f0: 400, f1: 60, dur: 0.5, vol: 0.3 }); break;
      case 'respawn': this.tone({ type: 'sine', f0: 300, f1: 900, dur: 0.3, vol: 0.25 }); break;
      case 'heal':    this.tone({ type: 'sine', f0: 520, f1: 880, dur: 0.18, vol: 0.2 }); break;
      case 'gem':     this.tone({ type: 'sine', f0: 900, f1: 1400, dur: 0.12, vol: 0.25 }); break;
      case 'cube':    this.tone({ type: 'triangle', f0: 500, f1: 1000, dur: 0.15, vol: 0.25 }); break;
      case 'wall':    this.noise({ f0: 600, f1: 120, dur: 0.25, vol: 0.35 }); break;
      case 'jump':    this.tone({ type: 'sine', f0: 260, f1: 780, dur: 0.25, vol: 0.3 }); break;
      case 'tele':    this.tone({ type: 'sawtooth', f0: 1200, f1: 200, dur: 0.25, vol: 0.2 }); break;
      case 'shield':  this.tone({ type: 'triangle', f0: 340, f1: 620, dur: 0.2, vol: 0.25 }); break;
      case 'freeze':  this.tone({ type: 'sine', f0: 1600, f1: 640, dur: 0.25, vol: 0.2 }); break;
      case 'gadget':  this.tone({ type: 'square', f0: 620, f1: 980, dur: 0.14, vol: 0.25 }); break;
      case 'hyper':   this.tone({ type: 'sawtooth', f0: 100, f1: 1400, dur: 0.5, vol: 0.35 }); break;
      case 'goal':    this.tone({ type: 'square', f0: 523, dur: 0.14, vol: 0.3 });
                      setTimeout(() => this.tone({ type: 'square', f0: 659, dur: 0.14, vol: 0.3 }), 130);
                      setTimeout(() => this.tone({ type: 'square', f0: 784, dur: 0.25, vol: 0.3 }), 260); break;
      case 'kick':    this.noise({ f0: 1800, f1: 300, dur: 0.12, vol: 0.35, filter: 'bandpass' }); break;
      case 'ui':      this.tone({ type: 'square', f0: 660, f1: 880, dur: 0.06, vol: 0.15 }); break;
      case 'buy':     this.tone({ type: 'sine', f0: 700, f1: 1100, dur: 0.12, vol: 0.25 });
                      setTimeout(() => this.tone({ type: 'sine', f0: 1100, f1: 1500, dur: 0.15, vol: 0.25 }), 100); break;
      case 'win':     [523, 659, 784, 1046].forEach((f, i) =>
                        setTimeout(() => this.tone({ type: 'square', f0: f, dur: 0.22, vol: 0.28 }), i * 160)); break;
      case 'lose':    [392, 330, 262, 196].forEach((f, i) =>
                        setTimeout(() => this.tone({ type: 'sawtooth', f0: f, dur: 0.25, vol: 0.22 }), i * 180)); break;
      case 'count':   this.tone({ type: 'square', f0: 440, dur: 0.1, vol: 0.3 }); break;
      case 'go':      this.tone({ type: 'square', f0: 880, dur: 0.3, vol: 0.35 }); break;
    }
  },

  /* ---------- Musica procedurale ----------
     Sequencer a 8 step: basso + arpeggio + hi-hat.
     Due tracce: 'menu' (rilassata) e 'battle' (incalzante). */
  music(track) {
    if (this.currentTrack === track) return;
    this.currentTrack = track;
    this.stopMusic();
    if (!this.ctx || track === null) return;
    this.step = 0;

    const patterns = {
      menu: {
        bpm: 96,
        bass: [55, 0, 65.4, 0, 49, 0, 58.3, 0],
        arp:  [220, 261.6, 329.6, 261.6, 196, 246.9, 293.7, 246.9],
        hat: [0, 1, 0, 1, 0, 1, 0, 1]
      },
      battle: {
        bpm: 148,
        bass: [55, 55, 0, 55, 73.4, 0, 55, 65.4],
        arp:  [440, 523.3, 659.3, 880, 659.3, 523.3, 440, 349.2],
        hat: [1, 1, 1, 1, 1, 1, 1, 1]
      }
    };
    const p = patterns[track];
    if (!p) return;
    const interval = 60000 / p.bpm / 2; // ottavi

    this.musicTimer = setInterval(() => {
      if (!Save.state.settings.music) return;
      const i = this.step % 8;
      const t = this.ctx.currentTime;
      // Basso
      if (p.bass[i]) {
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = 'triangle'; o.frequency.value = p.bass[i];
        g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
        o.connect(g); g.connect(this.musicGain); o.start(t); o.stop(t + 0.3);
      }
      // Arpeggio (solo su step alternati nel menu per respiro)
      if (p.arp[i] && (track === 'battle' || i % 2 === 0)) {
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = 'square'; o.frequency.value = p.arp[i];
        g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        o.connect(g); g.connect(this.musicGain); o.start(t); o.stop(t + 0.2);
      }
      // Hi-hat (rumore breve)
      if (p.hat[i] && this.ctx) {
        const len = Math.floor(this.ctx.sampleRate * 0.04);
        const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let j = 0; j < len; j++) d[j] = (Math.random() * 2 - 1) * (1 - j / len);
        const src = this.ctx.createBufferSource(); src.buffer = buf;
        const f = this.ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000;
        const g = this.ctx.createGain(); g.gain.value = 0.1;
        src.connect(f); f.connect(g); g.connect(this.musicGain); src.start(t);
      }
      this.step++;
    }, interval);
  },

  stopMusic() {
    if (this.musicTimer) { clearInterval(this.musicTimer); this.musicTimer = null; }
  }
};

/* ============================================================
   save.js — Sistema di salvataggio persistente (localStorage).
   Gestisce profilo, valute, progressi brawler, missioni,
   battle pass, impostazioni e statistiche.
   ============================================================ */
'use strict';

const SAVE_KEY = 'novabrawl_save_v1';

const Save = {
  state: null,

  /* Stato di default per un nuovo giocatore */
  defaults() {
    return {
      name: 'Giocatore' + Util.irand(100, 999),
      xp: 0,
      level: 1,
      coins: 200,
      gems: 50,
      pp: 0,                       // punti potere
      selectedBrawler: 'bolt',
      selectedMode: 'gemgrab',
      tutorialDone: false,
      /* Stato per-brawler: trofei, livello, punti potere spesi, skin */
      brawlers: { bolt: { trophies: 0, level: 1, skin: 'def', skins: ['def'] } },
      /* Missioni giornaliere/settimanali generate + progresso */
      quests: [],
      questsDay: 0,                // giorno di generazione (per il reset)
      questsWeek: 0,
      passPoints: 0,
      passClaimed: [],             // tier già riscattati
      shopDaily: 0,                // ultimo giorno del reclamo gemme gratis
      shopBought: [],              // acquisti one-shot del giorno
      stats: { matches: 0, wins: 0, kills: 0, deaths: 0, damage: 0, gems: 0, supers: 0, bestTrophies: 0 },
      settings: { music: true, sfx: true, vibration: true, autoFire: false, showFps: false, quality: 'alta' }
    };
  },

  load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      this.state = raw ? Object.assign(this.defaults(), JSON.parse(raw)) : this.defaults();
      /* merge profondo di settings/stats per retro-compatibilità */
      this.state.settings = Object.assign(this.defaults().settings, this.state.settings);
      this.state.stats = Object.assign(this.defaults().stats, this.state.stats);
    } catch (e) {
      console.warn('Salvataggio corrotto, reset:', e);
      this.state = this.defaults();
    }
    this.refreshQuests();
    this.save();
  },

  save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.state)); }
    catch (e) { console.warn('Impossibile salvare:', e); }
  },

  reset() {
    this.state = this.defaults();
    this.save();
  },

  /* ---------- Valute ---------- */
  addCoins(n) { this.state.coins += n; this.save(); },
  addGems(n) { this.state.gems += n; this.save(); },
  addPP(n) { this.state.pp += n; this.save(); },

  spendCoins(n) { if (this.state.coins < n) return false; this.state.coins -= n; this.save(); return true; },
  spendGems(n) { if (this.state.gems < n) return false; this.state.gems -= n; this.save(); return true; },

  /* ---------- Esperienza giocatore ---------- */
  xpForLevel(lv) { return 100 + (lv - 1) * 60; },
  addXp(n) {
    this.state.xp += n;
    while (this.state.xp >= this.xpForLevel(this.state.level)) {
      this.state.xp -= this.xpForLevel(this.state.level);
      this.state.level++;
      this.addCoins(50);           // bonus di livello
    }
    this.save();
  },

  /* ---------- Brawler ---------- */
  brawlerState(id) {
    if (!this.state.brawlers[id]) {
      this.state.brawlers[id] = { trophies: 0, level: 1, skin: 'def', skins: ['def'] };
    }
    return this.state.brawlers[id];
  },

  totalTrophies() {
    let t = 0;
    for (const id in this.state.brawlers) t += this.state.brawlers[id].trophies;
    return t;
  },

  /* Un brawler è sbloccato se i trofei totali superano la sua soglia */
  isUnlocked(id) {
    const def = BRAWLER_BY_ID[id];
    if (this.state.brawlers[id] && this.state.brawlers[id].unlockedByShop) return true;
    return this.totalTrophies() >= def.unlockTrophies;
  },

  addTrophies(brawlerId, n) {
    const b = this.brawlerState(brawlerId);
    b.trophies = Math.max(0, b.trophies + n);
    const tot = this.totalTrophies();
    if (tot > this.state.stats.bestTrophies) this.state.stats.bestTrophies = tot;
    this.save();
  },

  /* Potenzia un brawler se ci sono risorse sufficienti */
  upgradeBrawler(id) {
    const b = this.brawlerState(id);
    if (b.level >= 11) return { ok: false, msg: 'Livello massimo!' };
    const cost = UPGRADE_COST[b.level];
    if (this.state.pp < cost) return { ok: false, msg: `Servono ${cost} punti potere` };
    if (this.state.coins < cost) return { ok: false, msg: `Servono ${cost} monete` };
    this.state.pp -= cost;
    this.state.coins -= cost;
    b.level++;
    this.save();
    return { ok: true, msg: `${BRAWLER_BY_ID[id].name} è ora livello ${b.level}!` };
  },

  buySkin(brawlerId, skinId) {
    const def = BRAWLER_BY_ID[brawlerId];
    const skin = def.skins.find(s => s.id === skinId);
    const b = this.brawlerState(brawlerId);
    if (b.skins.includes(skinId)) { b.skin = skinId; this.save(); return { ok: true, msg: 'Skin equipaggiata!' }; }
    if (!this.spendCoins(skin.price)) return { ok: false, msg: `Servono ${skin.price} monete` };
    b.skins.push(skinId);
    b.skin = skinId;
    this.save();
    return { ok: true, msg: `Skin ${skin.name} acquistata!` };
  },

  /* ---------- Missioni ----------
     Rigenerate a mezzanotte (giornaliere) e ogni lunedì (settimanali). */
  refreshQuests() {
    const now = new Date();
    const day = Math.floor(now.getTime() / 86400000);
    const week = Math.floor((day + 3) / 7);   // epoch giovedì -> lunedì
    let changed = false;

    if (this.state.questsDay !== day) {
      this.state.quests = this.state.quests.filter(q => q.weekly);
      const picks = Util.shuffle(QUEST_TEMPLATES.slice()).slice(0, 4);
      for (const t of picks) {
        this.state.quests.push({
          tid: t.id, weekly: false, target: t.daily, progress: 0, claimed: false,
          name: t.name.replace('{n}', Util.fmt(t.daily)), icon: t.icon, stat: t.stat, reward: t.reward
        });
      }
      this.state.questsDay = day;
      this.state.shopDaily = this.state.shopDaily === day ? day : 0; // reset gemme gratis
      this.state.shopBought = [];
      changed = true;
    }
    if (this.state.questsWeek !== week) {
      this.state.quests = this.state.quests.filter(q => !q.weekly);
      const picks = Util.shuffle(QUEST_TEMPLATES.slice()).slice(0, 3);
      for (const t of picks) {
        this.state.quests.push({
          tid: t.id, weekly: true, target: t.weekly, progress: 0, claimed: false,
          name: t.name.replace('{n}', Util.fmt(t.weekly)), icon: t.icon, stat: t.stat, reward: t.reward * 3
        });
      }
      this.state.questsWeek = week;
      changed = true;
    }
    if (changed) this.save();
  },

  /* Registra progresso su tutte le missioni con quella statistica */
  questProgress(stat, amount) {
    for (const q of this.state.quests) {
      if (q.stat === stat && !q.claimed) q.progress = Math.min(q.target, q.progress + amount);
    }
    this.save();
  },

  claimQuest(index) {
    const q = this.state.quests[index];
    if (!q || q.claimed || q.progress < q.target) return false;
    q.claimed = true;
    this.state.passPoints += q.reward;
    this.addCoins(Math.floor(q.reward / 2));
    this.save();
    return true;
  },

  /* ---------- Battle Pass ---------- */
  passTier() { return Math.min(30, Math.floor(this.state.passPoints / PASS_POINTS_PER_TIER)); },

  claimPassTier(tier) {
    if (this.state.passClaimed.includes(tier) || this.passTier() < tier) return null;
    const r = PASS_TIERS[tier - 1];
    this.state.passClaimed.push(tier);
    if (r.coins) this.addCoins(r.coins);
    if (r.gems) this.addGems(r.gems);
    if (r.pp) this.addPP(r.pp);
    if (r.skinToken) {
      /* la skin esclusiva del pass: dorata per il brawler selezionato */
      const b = this.brawlerState(this.state.selectedBrawler);
      if (!b.skins.includes('oro')) b.skins.push('oro');
    }
    this.save();
    return r;
  },

  /* ---------- Fine partita: applica ricompense ----------
     result: { win, rank, kills, damage, gems, supers, modeId, brawlerId } */
  applyMatchResult(r) {
    const s = this.state.stats;
    s.matches++;
    if (r.win) s.wins++;
    s.kills += r.kills;
    s.deaths += r.deaths || 0;
    s.damage += r.damage;
    s.gems += r.gems || 0;
    s.supers += r.supers || 0;

    /* Trofei: vittoria +8, pareggio +2, sconfitta -4 (showdown: per piazzamento) */
    let dt;
    if (r.rank !== undefined) dt = Math.max(-6, 8 - r.rank * 1.6) | 0;
    else dt = r.win ? 8 : (r.draw ? 2 : -4);
    this.addTrophies(r.brawlerId, dt);

    /* Valute ed esperienza */
    const coins = r.win ? 25 : 10;
    const xp = r.win ? 30 : 12;
    this.addCoins(coins);
    this.addXp(xp);
    this.state.passPoints += r.win ? 12 : 5;

    /* Progresso missioni */
    this.questProgress('matches', 1);
    if (r.win) this.questProgress('wins', 1);
    this.questProgress('kills', r.kills);
    this.questProgress('damage', r.damage);
    this.questProgress('gems', r.gems || 0);
    this.questProgress('supers', r.supers || 0);

    this.save();
    return { trophies: dt, coins, xp };
  }
};
